name: PyPI Distribution

on:
  # Published releases are verified only. Promotion runs as a dispatch on the
  # existing annotated version tag so all assets can be attached to a draft.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          Space-separated build directories to build. Default builds services
          and native; release promotion requires both.
        required: false
        default: "services native"
        type: string
      publish_pypi:
        description: >-
          Publish built distributions to PyPI. Defaults off and is separate
          from GitHub Release promotion.
        required: false
        default: false
        type: boolean
      promote_release:
        description: >-
          Build all release artifacts and publish an immutable GitHub Release
          from the selected existing annotated version tag.
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

env:
  PYTHON_VERSION: "3.13"

jobs:
  linux-candidate:
    # Linux v1 release-candidate assembly (C01). Runs the required
    # deterministic checks (safety/auth/download/data migration),
    # freezes the services bundle with optional policy disabled and
    # pinned sidecars, verifies the single candidate manifest, and
    # uploads the bundle as candidate artifacts. This job creates a
    # candidate only: it must never publish to PyPI/itch itself --
    # promotion goes through candidate-gate below.
    #
    # Runs unless sidecar fetching hard-failed. Ordinary dispatches may
    # omit sidecars; release promotion requires them.
    needs: [fetch-sidecars]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.fetch-sidecars.result != 'failure' &&
      needs.fetch-sidecars.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check CORE builder input readiness before installs
        run: python scripts/check_core_input_readiness.py --mode activate

      - name: Verify promotion tag and source identity
        env:
          PUBLISH_PYPI: ${{ inputs.publish_pypi || false }}
          PROMOTE_RELEASE: ${{ inputs.promote_release || false }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_release_identity.py \
            --event "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --source-sha "$GITHUB_SHA" \
            --publish-pypi "$PUBLISH_PYPI" \
            --promote-release "$PROMOTE_RELEASE"

      - name: Require reviewed sibling release inputs
        run: >-
          python scripts/check_reviewed_release_inputs.py
          --workflow .github/workflows/pypi-dispatch.yml

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          wheelhouse="$RUNNER_TEMP/linux-release-wheelhouse"
          tools="$RUNNER_TEMP/linux-ci-tools-wheelhouse"
          builder="$RUNNER_TEMP/linux-builder-wheelhouse"
          python scripts/stage_linux_release_artifacts.py \
            --manifest package/linux-release-v4-artifact-sources.json \
            --selected-lockfile package/constraints-linux-nvidia-cu129-linux-release.txt \
            --output-dir "$wheelhouse"
          python -m pip install --no-index --find-links "$wheelhouse" \
            --require-hashes -r "$wheelhouse/requirements.txt"
          python scripts/stage_linux_release_artifacts.py \
            --manifest package/linux-ci-tools-artifact-sources.json \
            --selected-lockfile package/constraints-linux-ci-tools.txt \
            --output-dir "$tools"
          python -m pip install --no-index --find-links "$tools" \
            --no-deps --require-hashes -r "$tools/requirements.txt"
          python scripts/stage_linux_release_artifacts.py \
            --manifest package/linux-builder-tools-artifact-sources.json \
            --selected-lockfile package/constraints-linux-builder-tools.txt \
            --output-dir "$builder"
          python -m pip install --no-index --find-links "$builder" \
            --no-deps --require-hashes -r "$builder/requirements.txt"
          python -m pip install --no-deps --no-build-isolation -e './services[linux-release]'
          python -m pip check

      # Required deterministic checks (C01): safety, auth, download,
      # and data-migration coverage. Identical file list to the PR
      # contract in eval-tests.yml; no continue-on-error anywhere
      # here. Keep the two lists in lockstep: a check that gates PRs
      # must gate releases too.
      - name: Run required deterministic checks
        run: |
          PYTHONPATH=services/src python -m pytest \
            scripts/tests/test_cuda_source_recipe.py \
            scripts/tests/test_cuda_wheel_handoff.py \
            scripts/tests/test_linux_ci_dependency_inputs.py \
            scripts/tests/test_apt_release_publisher.py \
            scripts/tests/test_apt_daemon_health_probe.py \
            scripts/tests/test_github_release_promotion.py \
            services/tests/test_release_identity.py \
            services/tests/test_debian_postinst_safety.py \
            services/tests/test_release_core_bundle.py \
            services/tests/test_core_input_readiness.py \
            services/tests/test_dependency_notices.py \
            services/tests/test_service_bootstrap.py \
            services/tests/test_legacy_api_surface.py \
            services/tests/test_loopback_auth.py \
            services/tests/test_secret_storage.py \
            services/tests/test_model_load_security.py \
            services/tests/test_cross_distribution_versions.py \
            services/tests/test_tool_sandbox_security.py \
            services/tests/test_dependency_constraints.py \
            services/tests/test_release_p02.py \
            services/tests/test_release_profile_activation.py \
            scripts/tests/test_check_reviewed_release_inputs.py \
            services/tests/test_native_package_isolation.py \
            services/tests/test_zimage_model_dir_config.py \
            services/tests/test_third_party_notices.py \
            services/tests/test_llm_request_for_action_parity.py \
            services/tests/test_content_safety_gate.py \
            services/tests/test_content_policy_mode.py \
            services/tests/test_optional_policy_streaming.py \
            services/tests/test_release_s04_packaged.py \
            services/tests/test_download_security.py \
            services/tests/test_release_b02.py \
            services/tests/test_import_boundaries.py \
            services/tests/test_security_package_pins.py \
            services/tests/test_run_tests_optional_smoke.py \
            -o addopts='' -q --junitxml=required-checks.xml
        env:
          AIRUNNER_HEADLESS: "1"
          AIRUNNER_HTTP_PORT: "8188"
          AIRUNNER_HTTP_HOST: "127.0.0.1"

      # Counts come from the JUnit XML: the pytest stdout tail is
      # deterministically lost in this job's log stream, so a green
      # step alone does not prove how many checks ran.
      - name: Upload required-check results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: required-check-results
          path: required-checks.xml

      - name: Download sidecar bundle artifacts
        if: needs.fetch-sidecars.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sidecar-bundles
          path: release-assets/sidecars

      # The assembler verifies the frozen tree and manifest; sidecars
      # stage next; the standalone verify below re-gates the final bytes.
      - name: Assemble candidate bundle
        run: |
          python scripts/assemble_linux_bundle.py \
            --base "${{ github.sha }}" \
            --distpath build/bundle-dist \
            --workpath build/bundle-work

      # Native sidecars land in bin/ after the freeze (PyInstaller
      # wipes its output dir, so nothing can be pre-seeded) and the
      # manifest is extended over them. Names cite spec
      # [runtimes]; runs on release only.
      - name: Stage sidecars and extend manifest
        if: github.event_name == 'workflow_dispatch' && inputs.promote_release == true && needs.fetch-sidecars.result == 'success'
        run: |
          bash packaging/linux/stage-sidecars.sh \
            --tarball \
            release-assets/sidecars/runtime-sidecars-linux.tar.gz \
            --checksums .github/native-sidecar-checksums.json \
            --tag-file .github/native-sidecar-version \
            --platform linux \
            --bundle build/bundle-dist/airunner-daemon \
            -- llama-server whisper-server

      # Re-verify the exact bytes about to ship: manifest shape,
      # hashes, required resources, and the exclusion scan.
      - name: Verify candidate manifest
        run: |
          extra=""
          if [ "${{ inputs.promote_release || false }}" = "true" ]; then
            extra="--require-sidecars"
          fi
          python scripts/inspect_linux_bundle.py \
            build/bundle-dist/airunner-daemon $extra

      - name: Package verified Linux candidate
        run: |
          VERSION="$(python services/setup.py --version)"
          python scripts/linux_candidate_artifact.py create \
            --bundle build/bundle-dist/airunner-daemon \
            --output-dir build/release-assets \
            --version "$VERSION" \
            --source-sha "${{ github.sha }}"

      - name: Upload Linux candidate archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-candidate
          path: build/release-assets/*.tar.gz
          if-no-files-found: error

  candidate-gate:
    # Promotion gate (C01): every required upstream result must be
    # exactly `success`. A required check that failed, was skipped
    # or cancelled, or is missing (empty result) blocks promotion --
    # there is deliberately no continue-on-error and no
    # `success || skipped` tolerance on this path. The gate script
    # knows the required set for a candidate or release promotion. Publish steps below
    # need this job, so nothing ships without a green candidate.
    needs:
      - fetch-sidecars
      - linux-candidate
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Gate candidate promotion on required checks
        run: |
          bash packaging/linux/candidate-gate.sh \
            --event "${{ inputs.promote_release == true && 'release' || github.event_name }}" \
            --check "fetch-sidecars=${{ needs.fetch-sidecars.result }}" \
            --check "linux-candidate=${{ needs.linux-candidate.result }}"

  build-python-package:
    # Nothing here builds or publishes without a green candidate gate.
    needs: [candidate-gate]
    if: always() && needs.candidate-gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify promotion tag and source identity
        env:
          PUBLISH_PYPI: ${{ inputs.publish_pypi || false }}
          PROMOTE_RELEASE: ${{ inputs.promote_release || false }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_release_identity.py \
            --event "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --source-sha "$GITHUB_SHA" \
            --publish-pypi "$PUBLISH_PYPI" \
            --promote-release "$PROMOTE_RELEASE"

      - name: Require reviewed sibling release inputs
        run: >-
          python scripts/check_reviewed_release_inputs.py
          --workflow .github/workflows/pypi-dispatch.yml

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Validate requested package selection
        env:
          PACKAGE_SELECTION: ${{ inputs.packages || 'services native' }}
          PROMOTE_RELEASE: ${{ inputs.promote_release || false }}
        run: |
          python - <<'PY'
          import os
          import re

          selection = os.environ["PACKAGE_SELECTION"]
          if not re.fullmatch(r"(services|native)( (services|native))*", selection):
              raise SystemExit("packages must contain unique services/native names")
          packages = selection.split()
          if len(packages) != len(set(packages)):
              raise SystemExit("packages must not contain duplicates")
          if os.environ["PROMOTE_RELEASE"] == "true" and set(packages) != {"services", "native"}:
              raise SystemExit("release promotion requires both services and native packages")
          PY

      - name: Build packages
        env:
          PACKAGE_SELECTION: ${{ inputs.packages || 'services native' }}
        run: |
          # Services-only surface: airunner-services (headless daemon +
          # runtimes + FastAPI) and airunner-native (launcher).
          # airunner-common (shared foundation) moved to its own
          # repository (issue #2197) and publishes from there now.
          # The former root `airunner` GUI distribution was removed;
          # this workflow builds `services` + `native` only.
          mkdir -p dist
          read -r -a packages <<< "$PACKAGE_SELECTION"
          for pkg in "${packages[@]}"; do
            echo "::group::build $pkg"
            python -m build --outdir dist "$pkg"
            echo "::endgroup::"
          done
          echo "Built artifacts:"; ls -1 dist/

      # A PyPI release cannot be replaced after upload. Install the candidate
      # through the documented top-level request into a clean environment and
      # exercise the daemon before publishing it.
      - name: Gate -- candidate artifact must run
        env:
          PUBLISH_PACKAGES: ${{ inputs.packages || 'services native' }}
        run: |
          VERSION="$(python services/setup.py --version)"
          echo "gating candidate version $VERSION for selection: $PUBLISH_PACKAGES"
          python scripts/artifact_runtime_gate.py \
            --find-links dist --version "$VERSION" \
            --packages "$PUBLISH_PACKAGES" \
            --require-optional-boundary

      - name: Recheck promotion tag before PyPI upload
        if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi == true
        env:
          PUBLISH_PYPI: "true"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_release_identity.py \
            --event "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --source-sha "$GITHUB_SHA" \
            --publish-pypi "$PUBLISH_PYPI"

      - name: Upload Python distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: dist/*

      - name: Publish package
        if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi == true
        uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          # A failed publish is expensive to diagnose after the fact and a
          # partial one cannot be undone, so make the upload say exactly what
          # PyPI rejected rather than a bare "400 Bad Request".
          verbose: true

  build-debian-package:
    # The apt source contains only a pull publisher. Build the .deb here,
    # after the same candidate gate and wheel artifact gate as the release;
    # only publish-release-assets may attach it to the exact release tag.
    if: github.event_name == 'workflow_dispatch' && inputs.promote_release == true
    needs: [candidate-gate, build-python-package]
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Check out exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check CORE builder input readiness before installs
        run: python scripts/check_core_input_readiness.py --mode activate

      - name: Verify promotion tag and source identity
        env:
          PROMOTE_RELEASE: "true"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_release_identity.py \
            --event "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --source-sha "$GITHUB_SHA" \
            --promote-release "$PROMOTE_RELEASE"

      - name: Install Debian build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper-compat dpkg-dev python3-venv

      - name: Set up the hash-locked CORE freeze environment
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CORE freeze inputs
        run: |
          core_env="$RUNNER_TEMP/airunner-core-build"
          python -m venv "$core_env"
          "$core_env/bin/python" -m pip install --require-hashes --only-binary=:all: \
            -r package/constraints-linux-core.txt
          "$core_env/bin/python" -m pip install --no-deps \
            --no-build-isolation ./services
          echo "AIRUNNER_CORE_PYTHON=$core_env/bin/python" >> "$GITHUB_ENV"

      - name: Build and bind the Debian package
        run: |
          dpkg-buildpackage --build=binary --no-sign
          debian_version="$(dpkg-parsechangelog --show-field Version)"
          mapfile -t packages < <(
            find .. -maxdepth 1 -type f -name 'airunner_*_amd64.deb' -print
          )
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "expected exactly one amd64 AIRunner .deb" >&2
            exit 1
          fi
          install -d -m 0755 build/debian-release
          install -m 0644 "${packages[0]}" build/debian-release/
          package="build/debian-release/$(basename "${packages[0]}")"
          python packaging/apt/release_manifest.py \
            --deb "$package" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --source-commit "$GITHUB_SHA" \
            --workflow .github/workflows/pypi-dispatch.yml \
            --workflow-event workflow_dispatch \
            --promotion-job publish-release-assets \
            --run-id "$GITHUB_RUN_ID" \
            --debian-version "$debian_version" \
            --output build/debian-release/airunner-apt-release.json

      - name: Upload Debian package and source manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debian-release
          path: build/debian-release/*
          if-no-files-found: error

  fetch-sidecars:
    # The sidecar build itself lives in Capsize-Games/airunner-native now
    # (a different toolchain -- cmake/mingw-w64/ninja -- on its own
    # release cadence). This downloads the pinned release's prebuilt
    # bundles rather than rebuilding them here; see
    # .github/native-sidecar-version for which tag.
    if: github.event_name == 'workflow_dispatch' && inputs.promote_release == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/native-sidecar-version
            .github/native-sidecar-checksums.json
            scripts/sidecar_archive.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download pinned sidecar bundles from airunner-native
        run: |
          tag="$(cat .github/native-sidecar-version)"
          for platform in linux windows; do
            python scripts/sidecar_archive.py check-pin \
              --checksums .github/native-sidecar-checksums.json \
              --tag-file .github/native-sidecar-version \
              --platform "$platform"
          done
          mkdir -p release-assets/sidecars
          for platform in linux windows; do
            archive="release-assets/sidecars/runtime-sidecars-${platform}.tar.gz"
            curl -fsSL \
              "https://github.com/Capsize-Games/airunner-native/releases/download/${tag}/runtime-sidecars-${platform}.tar.gz" \
              -o "$archive"
            python scripts/sidecar_archive.py verify \
              --tarball "$archive" \
              --checksums .github/native-sidecar-checksums.json \
              --tag-file .github/native-sidecar-version \
              --platform "$platform"
          done

      - name: Upload sidecar bundle artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sidecar-bundles
          path: release-assets/sidecars/*

  publish-release-assets:
    # Create/resume a draft only after every artifact has been built and gated.
    # Attach the complete digest-checked set before publishing exactly once.
    if: github.event_name == 'workflow_dispatch' && inputs.promote_release == true
    needs: [build-python-package, build-debian-package, fetch-sidecars, candidate-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download Python distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: release-assets/python-dist

      - name: Download sidecar bundle artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sidecar-bundles
          path: release-assets/sidecars

      - name: Download verified Linux candidate archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-candidate
          path: release-assets/linux-candidate

      - name: Download Debian package and source manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: debian-release
          path: release-assets/debian

      - name: Verify candidate and checksum final release assets
        env:
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: |
          mapfile -t CANDIDATES < <(
            find release-assets/linux-candidate -maxdepth 1 -type f \
              -name '*.tar.gz' -print | sort
          )
          if [ "${#CANDIDATES[@]}" -ne 1 ]; then
            echo "expected exactly one Linux candidate archive" >&2
            exit 1
          fi
          python scripts/linux_candidate_artifact.py verify \
            --archive "${CANDIDATES[0]}" \
            --source-sha "$RELEASE_SOURCE_SHA"
          mapfile -t ASSETS < <(
            find release-assets/python-dist release-assets/sidecars \
              release-assets/linux-candidate release-assets/debian \
              -maxdepth 1 -type f -print | sort
          )
          python scripts/linux_candidate_artifact.py checksums \
            --output release-assets/SHA256SUMS "${ASSETS[@]}"

      - name: Create draft, attach all assets, and publish immutable release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_release_identity.py \
            --event "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --source-sha "$GITHUB_SHA" \
            --promote-release-assets \
            --run-id "$GITHUB_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --asset-dir release-assets/python-dist \
            --asset-dir release-assets/sidecars \
            --asset-dir release-assets/linux-candidate \
            --asset-dir release-assets/debian \
            --asset-file release-assets/SHA256SUMS

  verify-published-release:
    # Any release.published run is verification-only. The dispatch promotion
    # verifies publication itself because GITHUB_TOKEN may suppress this event.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out exact published source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify published immutable release without mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_release_identity.py \
            --event "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --source-sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --verify-published-release
