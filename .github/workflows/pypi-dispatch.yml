name: PyPI Distribution

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          Space-separated build directories to build. Default builds the
          services and native distributions.
        required: false
        default: "services native"
        type: string
      publish_pypi:
        description: >-
          Publish built distributions to PyPI. Defaults off; release events
          only build and attach GitHub release artifacts.
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

env:
  PYTHON_VERSION: "3.13"

jobs:
  provision-policy:
    # Trusted release-only policy provisioning (S06). Retrieves the
    # already-compiled, signed private policy artifact with protected
    # release credentials, verifies its expected digest plus the
    # detached Ed25519 sidecar, and stages the verified bytes for the
    # release bundle. Never runs on untrusted PR code: this workflow
    # has no pull_request trigger, this job additionally requires the
    # release event, and secrets live in the protected `release-policy`
    # environment (owner-managed; see
    # release-planning/linux-v1/policy-provisioning.md). All actions
    # below are pinned to immutable commit SHAs.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: release-policy
    permissions:
      contents: read

    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify promotion tag and source identity
        env:
          PUBLISH_PYPI: "false"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_release_identity.py \
            --event "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --source-sha "$GITHUB_SHA" \
            --publish-pypi "$PUBLISH_PYPI"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "cryptography==50.0.2"

      # Secrets arrive via the environment only and are never echoed,
      # listed, or dumped: no `set -x`, no `env` output, no debug
      # artifacts. The stage script prints counts and the signing key
      # ID only -- never terms, hashes, digests, or key material.
      #
      # The verified .dat, detached .sig, and single-key public trust
      # resource ride the one-day fragment into package builds. No source
      # list or private key enters the runner.
      - name: Retrieve and stage signed policy artifact
        env:
          POLICY_ARTIFACT_URL: ${{ secrets.POLICY_ARTIFACT_URL }}
          POLICY_ARTIFACT_TOKEN: ${{ secrets.POLICY_ARTIFACT_TOKEN }}
          POLICY_ARTIFACT_SHA256: ${{ secrets.POLICY_ARTIFACT_SHA256 }}
          POLICY_TRUST_STORE_JSON: ${{ secrets.POLICY_TRUST_STORE_JSON }}
        run: |
          mkdir -p "$RUNNER_TEMP/policy-release" "$RUNNER_TEMP/policy-staged"
          curl -fsSL -H "Authorization: Bearer $POLICY_ARTIFACT_TOKEN" \
            "$POLICY_ARTIFACT_URL" \
            -o "$RUNNER_TEMP/policy-release/policy_terms.dat"
          curl -fsSL -H "Authorization: Bearer $POLICY_ARTIFACT_TOKEN" \
            "$POLICY_ARTIFACT_URL.sig" \
            -o "$RUNNER_TEMP/policy-release/policy_terms.dat.sig"
          # Fail closed on an empty download before anything is staged.
          test -s "$RUNNER_TEMP/policy-release/policy_terms.dat"
          test -s "$RUNNER_TEMP/policy-release/policy_terms.dat.sig"
          printf '%s' "$POLICY_TRUST_STORE_JSON" \
            > "$RUNNER_TEMP/policy-release/trust-store.json"
          python scripts/build_policy_terms.py --stage-release \
            --artifact "$RUNNER_TEMP/policy-release/policy_terms.dat" \
            --trust-store "$RUNNER_TEMP/policy-release/trust-store.json" \
            --expected-sha256 "$POLICY_ARTIFACT_SHA256" \
            --output "$RUNNER_TEMP/policy-staged/policy_terms.dat"
          test -s "$RUNNER_TEMP/policy-staged/policy_terms.dat.sig"
          test -s "$RUNNER_TEMP/policy-staged/policy_trust_store.json"
          # Fail closed on an empty stage before the fragment exists.
          test -s "$RUNNER_TEMP/policy-staged/policy_terms.dat"
          test -s "$RUNNER_TEMP/policy-staged/policy_terms.dat.sig"
          # Drop the full input trust store; only the verified signer’s
          # public key remains in the staged package resource.
          rm "$RUNNER_TEMP/policy-release/trust-store.json"

      # The fragment holds verified hashes, the detached signature, and
      # only the verified signer's public key. It is a release-bundle
      # input with a one-day retention, not a general downloadable artifact.
      - name: Upload verified policy fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: policy-bundle-fragment
          path: ${{ runner.temp }}/policy-staged/
          if-no-files-found: error
          retention-days: 1

  provision-policy-fixture:
    # Secret-free wiring check (S06): exercises the same release-stage
    # script with throwaway keys and synthetic data. No environment, no
    # secrets; safe to run on every dispatch of this workflow.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "cryptography==50.0.2" pytest pyyaml

      - name: Validate release-stage wiring with synthetic fixtures
        run: |
          PYTHONPATH=services/src python -m pytest \
            services/tests/test_release_s06.py -o addopts='' -q

  linux-candidate:
    # Linux v1 release-candidate assembly (C01). Runs the required
    # deterministic checks (safety/auth/download/data migration),
    # freezes the services bundle with the provisioned policy and
    # pinned sidecars, verifies the single candidate manifest, and
    # uploads the bundle as candidate artifacts. This job creates a
    # candidate only: it must never publish to PyPI/itch itself --
    # promotion goes through candidate-gate below.
    #
    # Runs unless an upstream hard-failed: on workflow_dispatch the
    # release-only upstreams skip by design and the candidate builds
    # with the packaged policy data and no sidecars (the inspector
    # warns); on release both must have run for --require-sidecars.
    needs: [provision-policy, fetch-sidecars]
    if: >-
      always() &&
      needs.provision-policy.result != 'failure' &&
      needs.provision-policy.result != 'cancelled' &&
      needs.fetch-sidecars.result != 'failure' &&
      needs.fetch-sidecars.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify promotion tag and source identity
        env:
          PUBLISH_PYPI: ${{ inputs.publish_pypi || false }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_release_identity.py \
            --event "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --source-sha "$GITHUB_SHA" \
            --publish-pypi "$PUBLISH_PYPI"

      - name: Require reviewed sibling release inputs
        run: >-
          python scripts/check_reviewed_release_inputs.py
          --workflow .github/workflows/pypi-dispatch.yml

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Freeze profile from the P05 bundle spec: the linux-release
          # aggregate of services/setup.py under its P02 lock, plus the
          # pinned PyInstaller recipe and development extra for checks.
          pip install -c package/constraints-linux-nvidia-cu129-linux-release.txt \
            "pyinstaller==6.12.0"
          pip install -c package/constraints-linux-nvidia-cu129-linux-release.txt \
            -e "./services[linux-release,development]"

      # Required deterministic checks (C01): safety, auth, download,
      # and data-migration coverage. Identical file list to the PR
      # contract in eval-tests.yml; no continue-on-error anywhere
      # here. Keep the two lists in lockstep: a check that gates PRs
      # must gate releases too.
      - name: Run required deterministic checks
        run: |
          PYTHONPATH=services/src python -m pytest \
            services/tests/test_service_bootstrap.py \
            services/tests/test_legacy_api_surface.py \
            services/tests/test_loopback_auth.py \
            services/tests/test_secret_storage.py \
            services/tests/test_model_load_security.py \
            services/tests/test_cross_distribution_versions.py \
            services/tests/test_tool_sandbox_security.py \
            services/tests/test_dependency_constraints.py \
            services/tests/test_release_p02.py \
            services/tests/test_release_profile_activation.py \
            scripts/tests/test_check_reviewed_release_inputs.py \
            services/tests/test_native_package_isolation.py \
            services/tests/test_zimage_model_dir_config.py \
            services/tests/test_third_party_notices.py \
            services/tests/test_llm_request_for_action_parity.py \
            services/tests/test_content_safety_gate.py \
            services/tests/test_download_security.py \
            services/tests/test_release_b02.py \
            services/tests/test_import_boundaries.py \
            services/tests/test_security_package_pins.py \
            services/tests/test_run_tests_optional_smoke.py \
            -o addopts='' -q --junitxml=required-checks.xml
        env:
          AIRUNNER_HEADLESS: "1"
          AIRUNNER_HTTP_PORT: "8188"
          AIRUNNER_HTTP_HOST: "127.0.0.1"

      # Counts come from the JUnit XML: the pytest stdout tail is
      # deterministically lost in this job's log stream, so a green
      # step alone does not prove how many checks ran.
      - name: Upload required-check results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: required-check-results
          path: required-checks.xml

      - name: Download verified policy fragment
        if: needs.provision-policy.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: policy-bundle-fragment
          path: policy-fragment

      # The freeze collects content_safety/data/*.dat* from the
      # source tree (spec [[data]]), so the staged production policy
      # lands inside the frozen bundle and its manifest.
      - name: Install staged policy data
        if: needs.provision-policy.result == 'success'
        run: |
          ls -1 policy-fragment/
          cp policy-fragment/policy_terms.dat \
            services/src/airunner_services/content_safety/data/policy_terms.dat
          cp policy-fragment/policy_terms.dat.sig \
            services/src/airunner_services/content_safety/data/policy_terms.dat.sig
          cp policy-fragment/policy_trust_store.json \
            services/src/airunner_services/content_safety/data/policy_trust_store.json

      - name: Download sidecar bundle artifacts
        if: needs.fetch-sidecars.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sidecar-bundles
          path: release-assets/sidecars

      # The assembler's internal gate verifies the frozen tree,
      # policy payload, and manifest; sidecars stage next, and the
      # standalone verify below re-gates the final shipped bytes.
      - name: Assemble candidate bundle
        run: |
          python scripts/assemble_linux_bundle.py \
            --policy-trust-store \
            services/src/airunner_services/content_safety/data/policy_trust_store.json \
            --base "${{ github.sha }}" \
            --distpath build/bundle-dist \
            --workpath build/bundle-work

      # Native sidecars land in bin/ after the freeze (PyInstaller
      # wipes its output dir, so nothing can be pre-seeded) and the
      # manifest is extended over them, keeping native artifacts and
      # signed policy in the same manifest. Names cite spec
      # [runtimes]; runs on release only.
      - name: Stage sidecars and extend manifest
        if: needs.fetch-sidecars.result == 'success'
        run: |
          bash packaging/linux/stage-sidecars.sh \
            --tarball \
            release-assets/sidecars/runtime-sidecars-linux.tar.gz \
            --checksums .github/native-sidecar-checksums.json \
            --tag-file .github/native-sidecar-version \
            --platform linux \
            --bundle build/bundle-dist/airunner-daemon \
            -- llama-server whisper-server

      # Re-verify the exact bytes about to ship: manifest shape,
      # hashes, required resources, and the exclusion scan.
      - name: Verify candidate manifest
        run: |
          extra=""
          if [ "${{ github.event_name }}" = "release" ]; then
            extra="--require-sidecars"
          fi
          python scripts/inspect_linux_bundle.py \
            build/bundle-dist/airunner-daemon $extra

      - name: Package verified Linux candidate
        run: |
          VERSION="$(python services/setup.py --version)"
          python scripts/linux_candidate_artifact.py create \
            --bundle build/bundle-dist/airunner-daemon \
            --output-dir build/release-assets \
            --version "$VERSION" \
            --source-sha "${{ github.sha }}"

      - name: Upload Linux candidate archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-candidate
          path: build/release-assets/*.tar.gz
          if-no-files-found: error

  candidate-gate:
    # Promotion gate (C01): every required upstream result must be
    # exactly `success`. A required check that failed, was skipped
    # or cancelled, or is missing (empty result) blocks promotion --
    # there is deliberately no continue-on-error and no
    # `success || skipped` tolerance on this path. The gate script
    # knows the per-event required set: on release the trusted
    # provisioning and sidecar jobs must have run; on
    # workflow_dispatch they skip by design. Publish steps below
    # need this job, so nothing ships without a green candidate.
    needs:
      - provision-policy
      - provision-policy-fixture
      - fetch-sidecars
      - linux-candidate
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Gate candidate promotion on required checks
        run: |
          bash packaging/linux/candidate-gate.sh \
            --event "${{ github.event_name }}" \
            --check "provision-policy=${{ needs.provision-policy.result }}" \
            --check "provision-policy-fixture=${{ needs.provision-policy-fixture.result }}" \
            --check "fetch-sidecars=${{ needs.fetch-sidecars.result }}" \
            --check "linux-candidate=${{ needs.linux-candidate.result }}"

  build-python-package:
    # Fail closed on the release path: a release requires the verified
    # policy fragment, so provision-policy must be exactly `success`
    # there -- a failure or skip never builds or publishes. Ordinary
    # dispatches skip provisioning by design and build with the
    # packaged data. Nothing here publishes without a green candidate
    # (C01): the gate result must be exactly `success`, never skipped.
    needs: [provision-policy, candidate-gate]
    if: >-
      always() && needs.candidate-gate.result == 'success' && ((
      github.event_name == 'release' &&
      needs.provision-policy.result == 'success') || (
      github.event_name != 'release' && (
      needs.provision-policy.result == 'success' ||
      needs.provision-policy.result == 'skipped')))
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify promotion tag and source identity
        env:
          PUBLISH_PYPI: ${{ inputs.publish_pypi || false }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_release_identity.py \
            --event "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --source-sha "$GITHUB_SHA" \
            --publish-pypi "$PUBLISH_PYPI"

      - name: Require reviewed sibling release inputs
        run: >-
          python scripts/check_reviewed_release_inputs.py
          --workflow .github/workflows/pypi-dispatch.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      # Release only: install the verified policy fragment staged by
      # provision-policy so the built services package carries the
      # production hashes plus the detached signature. Dispatches skip
      # this and build with the packaged (empty/synthetic) data.
      - name: Download verified policy fragment
        if: needs.provision-policy.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: policy-bundle-fragment
          path: policy-fragment

      - name: Install staged policy data
        if: needs.provision-policy.result == 'success'
        run: |
          ls -1 policy-fragment/
          cp policy-fragment/policy_terms.dat \
            services/src/airunner_services/content_safety/data/policy_terms.dat
          cp policy-fragment/policy_terms.dat.sig \
            services/src/airunner_services/content_safety/data/policy_terms.dat.sig
          cp policy-fragment/policy_trust_store.json \
            services/src/airunner_services/content_safety/data/policy_trust_store.json

      - name: Build packages
        run: |
          # Services-only surface: airunner-services (headless daemon +
          # runtimes + FastAPI) and airunner-native (launcher).
          # airunner-common (shared foundation) moved to its own
          # repository (issue #2197) and publishes from there now.
          # The former root `airunner` GUI distribution was removed;
          # this workflow builds `services` + `native` only.
          mkdir -p dist
          for pkg in ${{ inputs.packages || 'services native' }}; do
            echo "::group::build $pkg"
            python -m build --outdir dist "$pkg"
            echo "::endgroup::"
          done
          echo "Built artifacts:"; ls -1 dist/

      # A PyPI release cannot be replaced after upload. Install the candidate
      # through the documented top-level request into a clean environment and
      # exercise the daemon before publishing it.
      - name: Gate -- candidate artifact must run
        env:
          PUBLISH_PACKAGES: ${{ inputs.packages || 'services native' }}
        run: |
          VERSION="$(python services/setup.py --version)"
          echo "gating candidate version $VERSION for selection: $PUBLISH_PACKAGES"
          python scripts/artifact_runtime_gate.py \
            --find-links dist --version "$VERSION" \
            --packages "$PUBLISH_PACKAGES" \
            --require-optional-boundary

      - name: Recheck promotion tag before PyPI upload
        if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi == true
        env:
          PUBLISH_PYPI: "true"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_release_identity.py \
            --event "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --source-sha "$GITHUB_SHA" \
            --publish-pypi "$PUBLISH_PYPI"

      - name: Upload Python distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

      - name: Publish package
        if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi == true
        uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          # A failed publish is expensive to diagnose after the fact and a
          # partial one cannot be undone, so make the upload say exactly what
          # PyPI rejected rather than a bare "400 Bad Request".
          verbose: true

  fetch-sidecars:
    # The sidecar build itself lives in Capsize-Games/airunner-native now
    # (a different toolchain -- cmake/mingw-w64/ninja -- on its own
    # release cadence). This downloads the pinned release's prebuilt
    # bundles rather than rebuilding them here; see
    # .github/native-sidecar-version for which tag.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/native-sidecar-version
            .github/native-sidecar-checksums.json
            scripts/sidecar_archive.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download pinned sidecar bundles from airunner-native
        run: |
          tag="$(cat .github/native-sidecar-version)"
          for platform in linux windows; do
            python scripts/sidecar_archive.py check-pin \
              --checksums .github/native-sidecar-checksums.json \
              --tag-file .github/native-sidecar-version \
              --platform "$platform"
          done
          mkdir -p release-assets/sidecars
          for platform in linux windows; do
            archive="release-assets/sidecars/runtime-sidecars-${platform}.tar.gz"
            curl -fsSL \
              "https://github.com/Capsize-Games/airunner-native/releases/download/${tag}/runtime-sidecars-${platform}.tar.gz" \
              -o "$archive"
            python scripts/sidecar_archive.py verify \
              --tarball "$archive" \
              --checksums .github/native-sidecar-checksums.json \
              --tag-file .github/native-sidecar-version \
              --platform "$platform"
          done

      - name: Upload sidecar bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-bundles
          path: release-assets/sidecars/*

  publish-release-assets:
    # Promotes the green candidate only (C01): the gate must have
    # passed, which already implies the candidate bundle verified.
    if: github.event_name == 'release'
    needs: [build-python-package, fetch-sidecars, candidate-gate]
    runs-on: ubuntu-latest

    steps:
      - name: Check out exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download Python distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: release-assets/python-dist

      - name: Download sidecar bundle artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sidecar-bundles
          path: release-assets/sidecars

      - name: Download verified Linux candidate archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-candidate
          path: release-assets/linux-candidate

      - name: Verify candidate and checksum final release assets
        env:
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: |
          mapfile -t CANDIDATES < <(
            find release-assets/linux-candidate -maxdepth 1 -type f \
              -name '*.tar.gz' -print | sort
          )
          if [ "${#CANDIDATES[@]}" -ne 1 ]; then
            echo "expected exactly one Linux candidate archive" >&2
            exit 1
          fi
          python scripts/linux_candidate_artifact.py verify \
            --archive "${CANDIDATES[0]}" \
            --source-sha "$RELEASE_SOURCE_SHA"
          mapfile -t ASSETS < <(
            find release-assets/python-dist release-assets/sidecars \
              release-assets/linux-candidate -maxdepth 1 -type f -print | sort
          )
          python scripts/linux_candidate_artifact.py checksums \
            --output release-assets/SHA256SUMS "${ASSETS[@]}"

      # Inspect the existing GitHub Release before uploading anything. This
      # rejects a previous candidate archive for this version from another
      # source SHA, and catches any filename collision before the upload action
      # can partially attach the new set of assets.
      - name: Preflight immutable release asset identities
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_release_identity.py \
            --event "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --source-sha "$GITHUB_SHA" \
            --check-release-assets \
            --repository "$GITHUB_REPOSITORY" \
            --asset-dir release-assets/python-dist \
            --asset-dir release-assets/sidecars \
            --asset-dir release-assets/linux-candidate \
            --asset-file release-assets/SHA256SUMS

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/python-dist/*
            release-assets/sidecars/*
            release-assets/linux-candidate/*
            release-assets/SHA256SUMS
          overwrite_files: false
          fail_on_unmatched_files: true
