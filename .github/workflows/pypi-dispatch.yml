name: PyPI Distribution

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          Space-separated build directories to publish. Default publishes all
          four. Use "shared services native" to create the sibling projects
          first -- see the comment on the build step.
        required: false
        default: "shared services native ."
        type: string

permissions:
  contents: write
  packages: write

env:
  PYTHON_VERSION: "3.13"

jobs:
  build-python-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build packages
        run: |
          # Publish the full package surface documented in the README
          # (issue #2061): airunner (GUI), airunner-services (headless
          # daemon + runtimes), airunner-native (launcher) and airunner-common
          # (shared foundation). airunner and airunner-native pin
          # airunner-services==VERSION / airunner-common==VERSION, so all four
          # must be published together or `pip install airunner` cannot
          # resolve. Each invocation produces an sdist and a wheel in dist/;
          # the publish step below uploads every artifact.
          # Publishing order matters the first time. airunner pins
          # airunner-common==VERSION and airunner-services==VERSION, and none
          # of the three sibling projects exist on PyPI yet. If airunner
          # uploads but a sibling fails -- e.g. a project-scoped token that
          # cannot create new projects -- then `pip install airunner` is
          # permanently unresolvable at that version, because PyPI versions
          # can be yanked but never replaced.
          #
          # So dispatch once with packages="shared services native" to create
          # the siblings, confirm all three appear on PyPI, then dispatch again
          # with packages="." for airunner itself. After the projects exist,
          # the default (all four) is safe.
          mkdir -p dist
          for pkg in ${{ inputs.packages || 'shared services native .' }}; do
            echo "::group::build $pkg"
            # The root package refuses to build when the generated Qt
            # *_ui.py / resources.py files are missing or stale. They are not
            # committed, and a PEP 517 isolated build only installs the
            # declared build-system requirements, so it cannot generate them
            # itself -- they have to exist before `python -m build` runs.
            # Only the root package needs them; the siblings are pure Python.
            if [ "$pkg" = "." ]; then
              pip install "PySide6==6.9.0"
              QT_QPA_PLATFORM=offscreen python scripts/build_ui.py
            fi
            python -m build --outdir dist "$pkg"
            echo "::endgroup::"
          done
          echo "Built artifacts:"; ls -1 dist/

      - name: Upload Python distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

      # A published PyPI version can be yanked but never replaced, so the
      # candidate has to be proven before upload, not after. 6.1.3 resolved,
      # installed, and still could not start: airunner_services imports
      # pygments at module scope and nothing declared it. The runtime-smoke
      # jobs did not catch it because they run from a source checkout, where
      # the dev environment already supplies it.
      #
      # This installs the candidate through the ADVERTISED top-level request
      # (not by bulk-installing every built wheel, which would hide a missing
      # dependency edge between the four distributions) into a clean
      # interpreter outside the source tree, and then runs it.
      #
      # This step is deliberately NOT conditional. An earlier revision skipped
      # it for sibling-only selections, which let a package selection reach
      # Publish with no validation at all -- a skipped gate is not a passed
      # gate. The script now validates the selection itself and fails on any
      # profile it cannot execute.
      - name: Gate -- candidate artifact must run
        run: |
          VERSION="$(python -c 'import sys; sys.path.insert(0, "shared"); from airunner_common.package_metadata import VERSION; print(VERSION)')"
          PACKAGES="${{ inputs.packages || 'shared services native .' }}"
          echo "gating candidate version $VERSION for selection: $PACKAGES"
          python scripts/artifact_runtime_gate.py \
            --find-links dist --version "$VERSION" --packages "$PACKAGES"

      - name: Publish package
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          # A failed publish is expensive to diagnose after the fact and a
          # partial one cannot be undone, so make the upload say exactly what
          # PyPI rejected rather than a bare "400 Bad Request".
          verbose: true

  fetch-sidecars:
    # The sidecar build itself lives in Capsize-Games/airunner-native now
    # (a different toolchain -- cmake/mingw-w64/ninja -- on its own
    # release cadence). This downloads the pinned release's prebuilt
    # bundles rather than rebuilding them here; see
    # .github/native-sidecar-version for which tag.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/native-sidecar-version
          sparse-checkout-cone-mode: false

      - name: Download pinned sidecar bundles from airunner-native
        run: |
          tag="$(cat .github/native-sidecar-version)"
          mkdir -p release-assets/sidecars
          for platform in linux windows; do
            curl -fsSL \
              "https://github.com/Capsize-Games/airunner-native/releases/download/${tag}/runtime-sidecars-${platform}.tar.gz" \
              -o "release-assets/sidecars/runtime-sidecars-${platform}.tar.gz"
          done

      - name: Upload sidecar bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-bundles
          path: release-assets/sidecars/*

  publish-release-assets:
    if: github.event_name == 'release'
    needs: [build-python-package, fetch-sidecars]
    runs-on: ubuntu-latest

    steps:
      - name: Download Python distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: release-assets/python-dist

      - name: Download sidecar bundle artifacts
        uses: actions/download-artifact@v4
        with:
          name: sidecar-bundles
          path: release-assets/sidecars

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/python-dist/*
            release-assets/sidecars/*
          overwrite_files: true
