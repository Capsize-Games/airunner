name: CUDA native build bootstrap

on:
  pull_request:
    paths:
      - .github/workflows/cuda-build-image-inventory.yml
  workflow_dispatch:

permissions: {}

jobs:
  inventory:
    name: Inspect and bootstrap pinned CUDA image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Pull and identify the supported amd64 image
        shell: bash
        run: |
          set -euo pipefail
          image='nvidia/cuda:12.9.2-devel-ubuntu24.04@sha256:16656a1ef115bca9e1f820c6349876f1486d2b3c9a0e615773799fe402960dc5'
          docker pull --platform linux/amd64 "$image"
          docker image inspect "$image" --format \
            'image_id={{.Id}} repo_digests={{json .RepoDigests}} os={{.Os}} arch={{.Architecture}} created={{.Created}} size={{.Size}}'

      - name: Inventory compilers, build tools, Python, and CUDA libraries
        shell: bash
        run: |
          set -euo pipefail
          image='nvidia/cuda:12.9.2-devel-ubuntu24.04@sha256:16656a1ef115bca9e1f820c6349876f1486d2b3c9a0e615773799fe402960dc5'
          docker run --rm --pull=never --platform linux/amd64 \
            --network=none --cap-drop=ALL --security-opt=no-new-privileges \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --entrypoint /bin/bash "$image" -ceu '
              echo "== OS =="
              cat /etc/os-release
              echo "== command paths =="
              for tool in nvcc cuobjdump gcc g++ cmake ninja make python3 python3.13; do
                if path=$(command -v "$tool" 2>/dev/null); then
                  printf "%s=%s\n" "$tool" "$path"
                else
                  printf "%s=MISSING\n" "$tool"
                fi
              done
              echo "== tool versions =="
              nvcc --version 2>&1 || true
              cuobjdump --version 2>&1 || true
              gcc --version 2>&1 | head -n 2 || true
              g++ --version 2>&1 | head -n 2 || true
              cmake --version 2>&1 | head -n 2 || true
              ninja --version 2>&1 || true
              make --version 2>&1 | head -n 2 || true
              python3 --version 2>&1 || true
              python3.13 --version 2>&1 || true
              echo "== relevant installed packages =="
              dpkg-query -W -f="\${Package}=\${Version}\n" 2>/dev/null \
                | grep -Ei "(cuda|cublas|cccl|nccl|cmake|ninja|gcc|g\+\+|make|python3|libssl|libuv)" \
                | sort || true
              echo "== relevant shared libraries =="
              ldconfig -p 2>/dev/null \
                | grep -Ei "(cudart|cublas|nvrtc|nccl|libstdc\+\+|libssl|libuv)" \
                | sort || true
              echo "== apt source configuration =="
              grep -RhsE "^(Types|URIs|Suites|Components|Signed-By):" \
                /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true
              echo "== image license =="
              if [ -f /NGC-DL-CONTAINER-LICENSE ]; then
                sha256sum /NGC-DL-CONTAINER-LICENSE
                cat /NGC-DL-CONTAINER-LICENSE
              else
                echo "NGC-DL-CONTAINER-LICENSE=MISSING"
              fi
              echo "== NVIDIA entrypoint files (read only; not executed) =="
              if [ -d /opt/nvidia ]; then
                find /opt/nvidia -maxdepth 4 -type f -print0 \
                  | sort -z \
                  | xargs -0 -r sha256sum
                for file in /opt/nvidia/nvidia_entrypoint.sh \
                            /opt/nvidia/entrypoint.d/*; do
                  if [ -f "$file" ]; then
                    echo "--- $file ---"
                    sed -n "1,240p" "$file"
                  fi
                done
              else
                echo "/opt/nvidia=MISSING"
              fi
            '

      - name: Stage hash-pinned Kitware CMake binary input
        shell: bash
        run: |
          set -euo pipefail
          input_dir="$RUNNER_TEMP/cmake-binary-input"
          mkdir -p "$input_dir"
          archive="$input_dir/cmake-3.31.6-linux-x86_64.tar.gz"
          curl --fail --location --silent --show-error \
            'https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz' \
            --output "$archive"
          # Archive SHA is pinned by CMakeUrls.cmake in the reviewed
          # scikit-build/cmake-python-distributions v3.31.6 source tag
          # (commit 8b974dcfed398bf534c9e21331574e52756c8e0b).
          printf '%s  %s\n' \
            '5a1133ff103c71eb5120e2cc3de922733e7d8a26a98ae716397e8676adb367bf' \
            "$archive" | sha256sum --check --status
          sha256sum "$archive"

      - name: Inspect and verify CMake inside the isolated CUDA image
        shell: bash
        run: |
          set -euo pipefail
          image='nvidia/cuda:12.9.2-devel-ubuntu24.04@sha256:16656a1ef115bca9e1f820c6349876f1486d2b3c9a0e615773799fe402960dc5'
          input_dir="$RUNNER_TEMP/cmake-binary-input"
          output_dir="$RUNNER_TEMP/cmake-binary-inspect"
          mkdir -p "$output_dir"
          docker run --rm --pull=never --platform linux/amd64 \
            --network=none --cpus=2 --memory=6g --pids-limit=1024 \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --mount "type=bind,src=$input_dir,dst=/inputs,readonly" \
            --mount "type=bind,src=$output_dir,dst=/out" \
            --entrypoint /bin/bash "$image" -ceu '
              mkdir -p /out/install
              tar --extract --gzip --no-same-owner --no-same-permissions \
                --file /inputs/cmake-3.31.6-linux-x86_64.tar.gz \
                --directory /out/install
              cmake_bin=/out/install/cmake-3.31.6-linux-x86_64/bin/cmake
              test -x "$cmake_bin"
              sha256sum "$cmake_bin"
              test "$(sha256sum "$cmake_bin" | cut -d " " -f 1)" \
                = c4b3b237dc7a013590db9e90f70fca2dfdedde09521e920d3339569ea364230a
              cpack_bin=/out/install/cmake-3.31.6-linux-x86_64/bin/cpack
              ctest_bin=/out/install/cmake-3.31.6-linux-x86_64/bin/ctest
              sha256sum "$cpack_bin" "$ctest_bin"
              # These expected hashes were measured from the verified
              # official Kitware archive; no PyPI wheel executable is used.
              test "$(sha256sum "$cpack_bin" | cut -d " " -f 1)" \
                = fecbf350f31c0ffa70412a9a17c1a27cf64fc09a5cfda19ce1cbff158ebc17b2
              test "$(sha256sum "$ctest_bin" | cut -d " " -f 1)" \
                = 2706cc813046fccae4f7d4c3553fde451ca10e82fda274bf3fa9941fdefbcfa6
              cat /out/install/cmake-3.31.6-linux-x86_64/doc/cmake/Copyright.txt
              ldd "$cmake_bin"
              export PATH="/out/install/cmake-3.31.6-linux-x86_64/bin:$PATH"
              cmake --version
            '
  build-llama-cpp-python:
    name: Build reviewed CUDA source wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Pull the supported amd64 CUDA image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cuda-wheel"
          image='nvidia/cuda:12.9.2-devel-ubuntu24.04@sha256:16656a1ef115bca9e1f820c6349876f1486d2b3c9a0e615773799fe402960dc5'
          docker pull --platform linux/amd64 "$image"
          docker image inspect "$image" --format \
            'image_id={{.Id}} repo_digests={{json .RepoDigests}} os={{.Os}} arch={{.Architecture}}' \
            > "$RUNNER_TEMP/cuda-wheel/image-info.txt"
          docker run --rm --pull=never --platform linux/amd64 --network=none \
            --cap-drop=ALL --security-opt=no-new-privileges --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m --entrypoint /bin/bash "$image" -ceu '
              printf "\n== image tool versions ==\n"
              cat /etc/os-release
              nvcc --version
              cuobjdump --version 2>&1 || true
              gcc --version | head -n 1
              g++ --version | head -n 1
              make --version | head -n 1
            ' >> "$RUNNER_TEMP/cuda-wheel/image-info.txt"

      - name: Fetch exact reviewed sources and hash-pinned build inputs
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/cuda-wheel"
          source="$root/source"
          mkdir -p "$source" "$root/backend" "$root/cmake" "$root/wheel" "$root/tmp"
          chmod 700 "$root" "$root/tmp"
          export GIT_TERMINAL_PROMPT=0
          git -c core.hooksPath=/dev/null init --quiet "$root/wrapper-repo"
          git -C "$root/wrapper-repo" config core.hooksPath /dev/null
          git -C "$root/wrapper-repo" remote add origin https://github.com/abetlen/llama-cpp-python.git
          git -C "$root/wrapper-repo" -c protocol.file.allow=never fetch --quiet --no-tags --depth=1 origin refs/tags/v0.3.21
          wrapper_commit=$(git -C "$root/wrapper-repo" rev-parse 'FETCH_HEAD^{commit}')
          test "$wrapper_commit" = d2bcbac46605f11d382426dd88d67e8b5c124cd7
          git -C "$root/wrapper-repo" archive --format=tar "$wrapper_commit" | tar -xf - -C "$source"
          gitlink=$(git -C "$root/wrapper-repo" ls-tree "$wrapper_commit" vendor/llama.cpp | awk '{print $3}')
          test "$gitlink" = f53577432541bb9edc1588c4ef45c66bf07e4468
          git -c core.hooksPath=/dev/null init --quiet "$root/llama-repo"
          git -C "$root/llama-repo" config core.hooksPath /dev/null
          git -C "$root/llama-repo" remote add origin https://github.com/ggerganov/llama.cpp.git
          git -C "$root/llama-repo" -c protocol.file.allow=never fetch --quiet --no-tags --depth=1 origin "$gitlink"
          llama_commit=$(git -C "$root/llama-repo" rev-parse 'FETCH_HEAD^{commit}')
          test "$llama_commit" = f53577432541bb9edc1588c4ef45c66bf07e4468
          mkdir -p "$source/vendor/llama.cpp"
          git -C "$root/llama-repo" archive --format=tar "$llama_commit" | tar -xf - -C "$source/vendor/llama.cpp"
          test ! -e "$source/.git"
          test ! -e "$source/vendor/llama.cpp/.git"
          printf 'wrapper_commit=%s\nllama_cpp_commit=%s\n' "$wrapper_commit" "$llama_commit" | tee "$root/source-revisions.txt"

          fetch_wheel() {
            local filename="$1" url="$2" sha="$3"
            curl --fail --location --silent --show-error "$url" --output "$root/backend/$filename"
            printf '%s  %s\n' "$sha" "$root/backend/$filename" | sha256sum --check --status
          }
          fetch_wheel scikit_build_core-1.1.1-py3-none-any.whl \
            'https://files.pythonhosted.org/packages/01/1b/83913d6d5c6a7f8ad5bf5d67b2d57ab09475f1bb9dd0c7a3f44067d59b90/scikit_build_core-1.1.1-py3-none-any.whl' \
            6f6d6cf600e2e9639fd258ecd11cfc19bd189354b968916a519c6793e7e26237
          fetch_wheel pathspec-1.1.1-py3-none-any.whl \
            'https://files.pythonhosted.org/packages/f1/d9/7fb5aa316bc299258e68c73ba3bddbc499654a07f151cba08f6153988714/pathspec-1.1.1-py3-none-any.whl' \
            a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189
          fetch_wheel packaging-26.3-py3-none-any.whl \
            'https://files.pythonhosted.org/packages/63/34/ba1c580383c9eada3711951fef0795c80b829a078d72188184bcab9dd527/packaging-26.3-py3-none-any.whl' \
            d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c

          cmake_archive="$root/cmake/cmake-3.31.6-linux-x86_64.tar.gz"
          curl --fail --location --silent --show-error \
            'https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz' \
            --output "$cmake_archive"
          printf '%s  %s\n' \
            5a1133ff103c71eb5120e2cc3de922733e7d8a26a98ae716397e8676adb367bf \
            "$cmake_archive" | sha256sum --check --status
          mkdir -p "$root/cmake/unpacked"
          tar -xzf "$cmake_archive" -C "$root/cmake/unpacked" --no-same-owner --no-same-permissions
          test "$(sha256sum "$root/cmake/unpacked/cmake-3.31.6-linux-x86_64/bin/cmake" | cut -d ' ' -f 1)" \
            = c4b3b237dc7a013590db9e90f70fca2dfdedde09521e920d3339569ea364230a

      - name: Set up reviewed Python build host
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.5'

      - name: Install only the reviewed PEP 517 backend wheels
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/cuda-wheel"
          python --version
          mkdir -p "$root/backend-site"
          python - "$root/backend" "$root/backend-site" <<'PY'
          import hashlib
          import pathlib
          import sys
          import zipfile

          source, target = map(pathlib.Path, sys.argv[1:])
          expected = {
              "scikit_build_core-1.1.1-py3-none-any.whl":
                  "6f6d6cf600e2e9639fd258ecd11cfc19bd189354b968916a519c6793e7e26237",
              "pathspec-1.1.1-py3-none-any.whl":
                  "a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189",
              "packaging-26.3-py3-none-any.whl":
                  "d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c",
          }
          for filename, digest in expected.items():
              archive_path = source / filename
              actual = hashlib.sha256(archive_path.read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"wheel hash mismatch: {filename}: {actual}")
              with zipfile.ZipFile(archive_path) as archive:
                  for member in archive.infolist():
                      path = pathlib.PurePosixPath(member.filename)
                      if path.is_absolute() or ".." in path.parts:
                          raise SystemExit(f"unsafe wheel member: {member.filename}")
                      archive.extract(member, target)
              print(f"installed_reviewed_wheel={filename} sha256={actual}")
          PY
          {
            printf '== hosted runner ==\n'
            uname -a
            printf 'python_executable=%s\n' "$(python -c 'import sys; print(sys.executable)')"
            python --version
            git --version
            docker --version
            cat "$root/image-info.txt"
            printf '\nofficial_cmake_version=3.31.6\n'
            printf '\nsource_date_epoch=1777269304\n'
          } > "$root/build-inputs.txt"

      - name: Build offline through CMake in the pinned CUDA image
        shell: bash
        env:
          CUDA_IMAGE: nvidia/cuda:12.9.2-devel-ubuntu24.04@sha256:16656a1ef115bca9e1f820c6349876f1486d2b3c9a0e615773799fe402960dc5
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/cuda-wheel"
          source="$root/source"
          build="$root/build"
          tmp="$root/tmp"
          cmake_home="$root/cmake/unpacked/cmake-3.31.6-linux-x86_64"
          mkdir -p "$build" "$tmp"

          cat > "$root/cmake-docker" <<'WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${CUDA_IMAGE:?}"
          : "${CUDA_SOURCE:?}"
          : "${CUDA_BUILD:?}"
          : "${CUDA_TMP:?}"
          : "${CUDA_CMAKE_HOME:?}"
          : "${SOURCE_DATE_EPOCH:?}"
          # The reviewed upstream CMakeLists installs native libraries into
          # llama_cpp/lib in the source tree as well as SKBUILD_PLATLIB_DIR.
          # This source is a fresh per-run archive; keep it writable for install.
          exec docker run --rm --pull=never --platform linux/amd64 \
            --network=none --cpus=2 --memory=6g --pids-limit=1024 \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            --user "$(id -u):$(id -g)" --env HOME=/tmp --env TMPDIR="$CUDA_TMP" \
            --env CMAKE_BUILD_PARALLEL_LEVEL=2 --env SOURCE_DATE_EPOCH \
            --mount "type=bind,src=$CUDA_SOURCE,dst=$CUDA_SOURCE" \
            --mount "type=bind,src=$CUDA_BUILD,dst=$CUDA_BUILD" \
            --mount "type=bind,src=$CUDA_TMP,dst=$CUDA_TMP" \
            --mount "type=bind,src=$CUDA_CMAKE_HOME,dst=/opt/cmake,readonly" \
            --entrypoint /bin/bash "$CUDA_IMAGE" -ceu '
              mkdir -p /tmp/cuda-stubs
              ln -s /usr/local/cuda/targets/x86_64-linux/lib/stubs/libcuda.so /tmp/cuda-stubs/libcuda.so.1
              export LIBRARY_PATH="/tmp/cuda-stubs:${LIBRARY_PATH:-}"
              export LD_LIBRARY_PATH="/tmp/cuda-stubs:${LD_LIBRARY_PATH:-}"
              export PATH="/opt/cmake/bin:$PATH"
              exec /opt/cmake/bin/cmake "$@"
            ' cuda-cmake "$@"
          WRAPPER
          chmod 0755 "$root/cmake-docker"
          export CUDA_SOURCE="$source" CUDA_BUILD="$build" CUDA_TMP="$tmp"
          export CUDA_CMAKE_HOME="$cmake_home" CMAKE_EXECUTABLE="$root/cmake-docker"
          export CMAKE_GENERATOR='Unix Makefiles'
          export CMAKE_BUILD_PARALLEL_LEVEL=2 SOURCE_DATE_EPOCH=1777269304
          export CMAKE_ARGS='-DLLAMA_BUILD=ON -DLLAVA_BUILD=ON -DGGML_CUDA=ON -DGGML_NATIVE=OFF -DGGML_CUDA_ARCHITECTURES=120a-real -DCMAKE_CUDA_ARCHITECTURES=120a-real -DGGML_CUDA_CUB_3DOT2=OFF -DGGML_CUDA_NCCL=OFF -DLLAMA_CURL=OFF -DFETCHCONTENT_FULLY_DISCONNECTED=ON -DCMAKE_EXE_LINKER_FLAGS=-Wl,-rpath-link,/tmp/cuda-stubs'
          export PYTHONPATH="$root/backend-site"
          env -i \
            PATH="$PATH" HOME="$tmp" TMPDIR="$tmp" \
            LD_LIBRARY_PATH="${pythonLocation:?}/lib" \
            CUDA_IMAGE="$CUDA_IMAGE" CUDA_SOURCE="$CUDA_SOURCE" \
            CUDA_BUILD="$CUDA_BUILD" CUDA_TMP="$CUDA_TMP" \
            CUDA_CMAKE_HOME="$CUDA_CMAKE_HOME" \
            CMAKE_EXECUTABLE="$CMAKE_EXECUTABLE" \
            CMAKE_GENERATOR="$CMAKE_GENERATOR" CMAKE_BUILD_PARALLEL_LEVEL=2 \
            SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" CMAKE_ARGS="$CMAKE_ARGS" \
            PYTHONPATH="$PYTHONPATH" \
            python - "$source" "$root/wheel" "$build" <<'PY'
          import os
          import pathlib
          import sys

          from scikit_build_core.build import build_wheel

          source, wheel_dir, build_dir = map(pathlib.Path, sys.argv[1:])
          os.chdir(source)
          filename = build_wheel(
              str(wheel_dir), {"build-dir": str(build_dir)}
          )
          wheel = wheel_dir / filename
          if not wheel.is_file():
              raise SystemExit(f"backend did not create wheel: {wheel}")
          print(f"wheel={wheel}")
          PY
          shopt -s nullglob
          wheels=("$root"/wheel/llama_cpp_python-0.3.21-*.whl)
          test "${#wheels[@]}" -eq 1
          sha256sum "${wheels[0]}"

      - name: Verify wheel contents and SM 120 target configuration
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/cuda-wheel"
          wheel=$(find "$root/wheel" -maxdepth 1 -type f -name 'llama_cpp_python-0.3.21-*.whl' -print -quit)
          test -n "$wheel"
          cache=$(find "$root/build" -maxdepth 2 -name CMakeCache.txt -print -quit)
          test -n "$cache"
          grep -E '^GGML_CUDA_ARCHITECTURES:[^=]*=120a-real$' "$cache"
          grep -E '^CMAKE_CUDA_ARCHITECTURES:[^=]*=120a-real$' "$cache"
          cp "$cache" "$root/CMakeCache.txt"
          mkdir -p "$root/inspect"
          python3 - "$wheel" "$root/inspect" <<'PY'
          import hashlib, pathlib, sys, zipfile
          wheel, out = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          names = []
          with zipfile.ZipFile(wheel) as archive:
              for name in archive.namelist():
                  if name.startswith("llama_cpp/lib/") and (name.endswith(".so") or ".so." in name):
                      target = out / pathlib.Path(name).name
                      target.write_bytes(archive.read(name))
                      names.append(name)
          assert any("ggml-cuda" in name for name in names), names
          assert any("mtmd" in name for name in names), names
          assert any("llama" in name for name in names), names
          print("wheel_sha256=" + hashlib.sha256(wheel.read_bytes()).hexdigest())
          for name in sorted(names):
              print("wheel_elf=" + name)
          PY
          cuda_lib=$(find "$root/inspect" -maxdepth 1 -type f -name 'libggml-cuda.so*' -print -quit)
          test -n "$cuda_lib"
          readelf -d "$cuda_lib" | tee "$root/elf-dynamic.txt"
          ! grep -Eqi 'libcurl|libnccl' "$root/elf-dynamic.txt"
          image='nvidia/cuda:12.9.2-devel-ubuntu24.04@sha256:16656a1ef115bca9e1f820c6349876f1486d2b3c9a0e615773799fe402960dc5'
          mkdir -p "$root/evidence"
          docker run --rm --pull=never --platform linux/amd64 --network=none \
            --cpus=2 --memory=6g --pids-limit=1024 --cap-drop=ALL \
            --security-opt=no-new-privileges --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount "type=bind,src=$root/inspect,dst=/inspect,readonly" \
            --mount "type=bind,src=$root/evidence,dst=/evidence" \
            --entrypoint /bin/bash "$image" -ceu '
              cuda_lib=$(find /inspect -maxdepth 1 -type f -name "libggml-cuda.so*" -print -quit)
              test -n "$cuda_lib"
              cuobjdump --list-elf "$cuda_lib" | tee /evidence/cuobjdump.txt
              # This proves an SM 120 family code object; CMakeCache separately
              # verifies that the configured target was exactly 120a-real.
              grep -Eq "sm_120a|sm_120" /evidence/cuobjdump.txt
            '
          {
            cat "$root/source-revisions.txt"
            printf 'cuda_image=%s\n' "$image"
            printf 'cmake_archive_sha256=5a1133ff103c71eb5120e2cc3de922733e7d8a26a98ae716397e8676adb367bf\n'
            sha256sum "$root/cmake/unpacked/cmake-3.31.6-linux-x86_64/bin/cmake"
            printf 'cuda_arch=120a-real\nparallel_jobs=2\nsource_date_epoch=1777269304\nbyte_reproducibility=not-claimed\nnetwork_during_compile=none\nmodel_or_gpu_execution=none\n'
            cat "$root/build-inputs.txt"
            sha256sum "$root/CMakeCache.txt"
            sha256sum "$root"/backend/*.whl "$root"/wheel/*.whl
            sha256sum "$root/inspect"/* "$root/evidence/cuobjdump.txt"
          } > "$root/wheel/BUILD-MANIFEST.txt"

      - name: Upload reviewed CUDA wheel candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llama-cpp-python-cu129-sm120a
          path: ${{ runner.temp }}/cuda-wheel/wheel/*
          if-no-files-found: error
          retention-days: 14
