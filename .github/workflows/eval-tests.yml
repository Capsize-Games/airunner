name: Hybrid Runtime CI

on:
  pull_request:
    branches: [master, llm-refactor, hybrid-runtime-foundation]
  push:
    branches: [master, llm-refactor, hybrid-runtime-foundation]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13.5"

jobs:
  runtime-contract-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check CORE builder input readiness before installs
        run: python scripts/check_core_input_readiness.py --mode activate

      - name: Require reviewed sibling release inputs
        run: >-
          python scripts/check_reviewed_release_inputs.py
          --workflow .github/workflows/eval-tests.yml

      # Retain the pinned source checkout for the release-input gate's
      # revision check; the staged reviewed wheel is installed from the lock.
      - name: Checkout airunner-common source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Capsize-Games/airunner-common
          ref: 733b0f4c8fb38952866e9cf7be2cc69793a46e92
          path: .ci-sources/airunner-common
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libglx-mesa0 \
            libegl1 \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender-dev

      - name: Install Python dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          wheelhouse="$RUNNER_TEMP/linux-release-wheelhouse"
          tools="$RUNNER_TEMP/linux-ci-tools-wheelhouse"
          audit="$RUNNER_TEMP/runtime-contract-input-audit"
          mkdir -p "$audit"
          df -B1 --output=source,size,used,avail,pcent,target "$RUNNER_TEMP" "$GITHUB_WORKSPACE" | tee "$audit/capacity-before-staging.txt"
          free -b | tee "$audit/memory-before-staging.txt"
          cp package/constraints-linux-nvidia-cu129-linux-release.txt "$audit/runtime-lock.txt"
          cp package/constraints-linux-ci-tools.txt "$audit/ci-tools-lock.txt"
          cp package/linux-release-v4-artifact-sources.json "$audit/runtime-artifact-sources.json"
          cp package/linux-ci-tools-artifact-sources.json "$audit/ci-tools-artifact-sources.json"
          python scripts/stage_linux_release_artifacts.py \
            --manifest package/linux-release-v4-artifact-sources.json \
            --selected-lockfile package/constraints-linux-nvidia-cu129-linux-release.txt \
            --output-dir "$wheelhouse"
          python -m pip install --no-index --find-links "$wheelhouse" \
            --require-hashes -r "$wheelhouse/requirements.txt"
          python scripts/stage_linux_release_artifacts.py \
            --manifest package/linux-ci-tools-artifact-sources.json \
            --selected-lockfile package/constraints-linux-ci-tools.txt \
            --output-dir "$tools"
          cp "$wheelhouse/requirements.txt" "$audit/runtime-requirements.txt"
          cp "$wheelhouse/staging-receipt.json" "$audit/runtime-staging-receipt.json"
          cp "$tools/requirements.txt" "$audit/ci-tools-requirements.txt"
          cp "$tools/staging-receipt.json" "$audit/ci-tools-staging-receipt.json"
          python -m pip install --no-index --find-links "$tools" \
            --no-deps --require-hashes -r "$tools/requirements.txt"
          python -m pip install --no-deps --no-build-isolation -e './services[linux-release]'
          python -m pip check
          python - <<'PY'
          import torch
          x = torch.tensor([1.0, 2.0], device="cpu")
          assert torch.cuda.is_available() is False
          assert (x * 2).tolist() == [2.0, 4.0]
          print(f"CPU tensor contract passed using torch {torch.__version__}; CUDA hidden")
          PY
          df -B1 --output=source,size,used,avail,pcent,target "$RUNNER_TEMP" "$GITHUB_WORKSPACE" | tee "$audit/capacity-after-install-before-cleanup.txt"
          rm -rf -- "$wheelhouse" "$tools"
          df -B1 --output=source,size,used,avail,pcent,target "$RUNNER_TEMP" "$GITHUB_WORKSPACE" | tee "$audit/capacity-after-wheelhouse-cleanup.txt"

      # Required deterministic checks (C01: safety, auth, download,
      # data migration). This list is the PR-side half of the release
      # gate: linux-candidate in pypi-dispatch.yml runs the same
      # safety/auth/download/migration files before assembling the
      # bundle, and candidate-gate blocks promotion unless the full
      # required set reports success. No continue-on-error here.
      - name: Run runtime contract tests
        run: |
          pytest \
            services/tests/test_service_bootstrap.py \
            scripts/tests/test_cuda_source_recipe.py \
            scripts/tests/test_cuda_wheel_handoff.py \
            scripts/tests/test_linux_ci_dependency_inputs.py \
            scripts/tests/test_apt_release_publisher.py \
            scripts/tests/test_apt_daemon_health_probe.py \
            scripts/tests/test_github_release_promotion.py \
            services/tests/test_release_identity.py \
            services/tests/test_debian_postinst_safety.py \
            services/tests/test_release_core_bundle.py \
            services/tests/test_core_input_readiness.py \
            services/tests/test_dependency_notices.py \
            services/tests/test_legacy_api_surface.py \
            services/tests/test_loopback_auth.py \
            services/tests/test_secret_storage.py \
            services/tests/test_model_load_security.py \
            services/tests/test_cross_distribution_versions.py \
            services/tests/test_tool_sandbox_security.py \
            services/tests/test_dependency_constraints.py \
            services/tests/test_release_p02.py \
            services/tests/test_release_profile_activation.py \
            scripts/tests/test_check_reviewed_release_inputs.py \
            services/tests/test_native_package_isolation.py \
            services/tests/test_zimage_model_dir_config.py \
            services/tests/test_third_party_notices.py \
            services/tests/test_llm_request_for_action_parity.py \
            services/tests/test_content_safety_gate.py \
            services/tests/test_content_policy_mode.py \
            services/tests/test_optional_policy_streaming.py \
            services/tests/test_release_s04_packaged.py \
            services/tests/test_download_security.py \
            services/tests/test_security_package_pins.py \
            services/tests/test_release_b02.py \
            services/tests/test_import_boundaries.py \
            services/tests/test_run_tests_optional_smoke.py \
            services/tests/test_gguf_chat_handler_cpu_contract.py \
            services/tests/test_e5_model_identity.py \
            services/tests/test_e5_manager_runtime_lock.py \
            services/tests/test_embedding_space_fingerprint.py \
            services/tests/test_rag_reindex_transaction.py \
            services/tests/test_rag_reindex_worker.py \
            services/tests/test_rag_reindex_route.py \
            services/tests/test_rag_dependency_isolation.py \
            services/tests/test_rag_service_interface.py \
            services/tests/test_local_fallback_loaded_metadata.py \
            services/tests/test_ollama_embedding_contract.py \
            services/tests/test_ollama_runtime_metadata.py \
            services/tests/test_llm_worker_embedding_queue.py \
            -v \
            --tb=short \
            --junitxml=runtime-contracts.xml
        env:
          AIRUNNER_HEADLESS: "1"
          AIRUNNER_HTTP_PORT: "8188"
          AIRUNNER_HTTP_HOST: "127.0.0.1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          CUDA_VISIBLE_DEVICES: ""

      # Issue #2225 parity is covered by
      # services/tests/test_llm_request_for_action_parity.py in the
      # contract list above (the standalone compare script was removed
      # with the desktop client).

      - name: Upload runtime contract results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-contract-results
          path: runtime-contracts.xml

      - name: Upload runtime input and capacity audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-contract-input-audit
          path: ${{ runner.temp }}/runtime-contract-input-audit/*
          if-no-files-found: warn

  runtime-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    strategy:
      matrix:
        include:
          - name: llm
            smoke-flag: --llm-runtime-smoke
          - name: stt
            smoke-flag: --stt-runtime-smoke
          - name: art
            smoke-flag: --art-runtime-smoke
          - name: tts
            smoke-flag: --tts-runtime-smoke

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require reviewed sibling release inputs
        run: >-
          python scripts/check_reviewed_release_inputs.py
          --workflow .github/workflows/eval-tests.yml

      - name: Checkout airunner-common source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Capsize-Games/airunner-common
          ref: 733b0f4c8fb38952866e9cf7be2cc69793a46e92
          path: .ci-sources/airunner-common
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libglx-mesa0 \
            libegl1 \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender-dev

      - name: Install Python dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          wheelhouse="$RUNNER_TEMP/linux-release-wheelhouse"
          tools="$RUNNER_TEMP/linux-ci-tools-wheelhouse"
          audit="$RUNNER_TEMP/runtime-smoke-input-audit"
          mkdir -p "$audit"
          df -B1 --output=source,size,used,avail,pcent,target "$RUNNER_TEMP" "$GITHUB_WORKSPACE" | tee "$audit/capacity-before-staging.txt"
          free -b | tee "$audit/memory-before-staging.txt"
          cp package/constraints-linux-nvidia-cu129-linux-release.txt "$audit/runtime-lock.txt"
          cp package/constraints-linux-ci-tools.txt "$audit/ci-tools-lock.txt"
          cp package/linux-release-v4-artifact-sources.json "$audit/runtime-artifact-sources.json"
          cp package/linux-ci-tools-artifact-sources.json "$audit/ci-tools-artifact-sources.json"
          python scripts/stage_linux_release_artifacts.py \
            --manifest package/linux-release-v4-artifact-sources.json \
            --selected-lockfile package/constraints-linux-nvidia-cu129-linux-release.txt \
            --output-dir "$wheelhouse"
          python -m pip install --no-index --find-links "$wheelhouse" \
            --require-hashes -r "$wheelhouse/requirements.txt"
          python scripts/stage_linux_release_artifacts.py \
            --manifest package/linux-ci-tools-artifact-sources.json \
            --selected-lockfile package/constraints-linux-ci-tools.txt \
            --output-dir "$tools"
          cp "$wheelhouse/requirements.txt" "$audit/runtime-requirements.txt"
          cp "$wheelhouse/staging-receipt.json" "$audit/runtime-staging-receipt.json"
          cp "$tools/requirements.txt" "$audit/ci-tools-requirements.txt"
          cp "$tools/staging-receipt.json" "$audit/ci-tools-staging-receipt.json"
          python -m pip install --no-index --find-links "$tools" \
            --no-deps --require-hashes -r "$tools/requirements.txt"
          python -m pip install --no-deps --no-build-isolation -e './services[linux-release]'
          python -m pip check
          df -B1 --output=source,size,used,avail,pcent,target "$RUNNER_TEMP" "$GITHUB_WORKSPACE" | tee "$audit/capacity-after-install-before-cleanup.txt"
          rm -rf -- "$wheelhouse" "$tools"
          df -B1 --output=source,size,used,avail,pcent,target "$RUNNER_TEMP" "$GITHUB_WORKSPACE" | tee "$audit/capacity-after-wheelhouse-cleanup.txt"

      - name: Run ${{ matrix.name }} runtime smoke tests
        run: |
          python scripts/run_tests.py \
            ${{ matrix.smoke-flag }} \
            --verbose

      - name: Upload runtime smoke input and capacity audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-smoke-input-audit-${{ matrix.name }}
          path: ${{ runner.temp }}/runtime-smoke-input-audit/*
          if-no-files-found: warn

  packaging-gates:
    # import-boundary + artifact gates on every PR, so
    # boundary/packaging regressions cannot merge green. The static
    # artifact gate (check_artifact_imports) and the behavioural
    # runtime gate run here against the freshly built wheels in clean
    # environments; the release workflow (pypi-dispatch.yml) re-runs
    # the behavioural gate before Publish. The runtime gate fails
    # closed when the candidate VERSION already exists on PyPI (it
    # cannot prove it installed the local artifact) -- bump the
    # version when that fires on a PR. No continue-on-error here.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require reviewed sibling release inputs
        run: >-
          python scripts/check_reviewed_release_inputs.py
          --workflow .github/workflows/eval-tests.yml

      - name: Check reviewed CORE dependency readiness
        run: python scripts/check_core_input_readiness.py --mode activate

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install reviewed CORE and test inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tools="$RUNNER_TEMP/linux-ci-tools-wheelhouse"
          core="$RUNNER_TEMP/linux-core-ci-wheelhouse"
          python scripts/stage_linux_release_artifacts.py \
            --manifest package/linux-core-ci-artifact-sources.json \
            --selected-lockfile package/constraints-linux-core-ci.txt \
            --output-dir "$core"
          python -m pip install --isolated --no-index --find-links "$core" \
            --require-hashes --only-binary=:all: -r "$core/requirements.txt"
          python scripts/stage_linux_release_artifacts.py \
            --manifest package/linux-ci-tools-artifact-sources.json \
            --selected-lockfile package/constraints-linux-ci-tools.txt \
            --output-dir "$tools"
          python -m pip install --no-index --find-links "$tools" \
            --no-deps --require-hashes -r "$tools/requirements.txt"
          python -m pip check

      - name: Enforce import boundaries on the source tree
        run: |
          python scripts/check_import_boundaries.py
          pytest scripts/tests/test_import_boundary_rules.py -o addopts='' -q

      - name: Build candidate wheels
        run: |
          mkdir -p dist
          python scripts/build_python_distributions.py services --outdir dist
          python scripts/build_python_distributions.py native --outdir dist
          ls -1 dist/

      # The .deb ships native/ and airunner_common/ as loose files
      # with no dist-info (debian/airunner.install), so version drift
      # there is silent. Fail when the vendored pins disagree with
      # what the packages declare.
      - name: Debian vendored-version drift check
        run: |
          python - <<'EOF'
          import ast
          import hashlib
          import json
          import re
          from pathlib import Path
          from scripts.artifact_runtime_gate import release_version_from_setup


          native_version = release_version_from_setup(Path("native/setup.py"))
          vendor_root = Path("debian/vendor")
          vendor_record = json.loads(
              (vendor_root / "airunner-common.json").read_text(encoding="utf-8")
          )
          metadata_path = vendor_root / "airunner_common/package_metadata.py"
          metadata_tree = ast.parse(metadata_path.read_text(encoding="utf-8"))
          vendored = next(
              ast.literal_eval(node.value)
              for node in metadata_tree.body
              if isinstance(node, ast.Assign)
              and any(
                  isinstance(target, ast.Name) and target.id == "VERSION"
                  for target in node.targets
              )
          )
          services_src = Path("services/setup.py").read_text()
          required = re.search(
              r'"airunner-common~=(.*?)"', services_src
          ).group(1)
          assert native_version, "native VERSION is empty"
          assert vendor_record["distribution"] == "airunner-common"
          assert vendor_record["version"] == vendored
          assert vendor_record["source_repository"] == (
              "https://github.com/Capsize-Games/airunner-common"
          )
          assert vendor_record["source_commit"]
          assert re.fullmatch(r"[0-9a-f]{40}", vendor_record["source_commit"])
          assert re.fullmatch(r"[0-9a-f]{64}", vendor_record["wheel_sha256"])
          assert vendor_record["wheel_record_verified"] is True
          assert len(vendor_record["vendored_files_sha256"]) == 13
          actual_modules = sorted(
              f"airunner_common/{path.name}"
              for path in (vendor_root / "airunner_common").glob("*.py")
          )
          assert sorted(vendor_record["vendored_files_sha256"]) == actual_modules
          for relative, expected in vendor_record["vendored_files_sha256"].items():
              path = vendor_root / relative
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual == expected, f"vendored file hash mismatch: {path}"
          license_record = vendor_record["license"]
          assert license_record["spdx_id"] == "GPL-3.0-only"
          license_path = Path(license_record["path"])
          assert (
              hashlib.sha256(license_path.read_bytes()).hexdigest()
              == license_record["sha256"]
          )
          print(f"native={native_version} vendored-common={vendored} "
                f"services-requires~={required} source={vendor_record['source_commit']}")
          assert vendored == required, (
              f"vendored airunner-common {vendored} != services pin {required}"
          )
          EOF

      - name: Static artifact gate in a clean install
        run: |
          core="$RUNNER_TEMP/linux-core-ci-wheelhouse"
          python -m venv /tmp/artifact-static
          /tmp/artifact-static/bin/pip install --isolated --no-index \
            --find-links "$core" --require-hashes --only-binary=:all: \
            -r "$core/requirements.txt"
          SERVICE_VERSION="$(python services/setup.py --version)"
          NATIVE_VERSION="$(python native/setup.py --version)"
          /tmp/artifact-static/bin/pip install \
            --isolated --no-index --find-links dist --no-deps --force-reinstall \
            "airunner-services==$SERVICE_VERSION" \
            "airunner-native==$NATIVE_VERSION"
          /tmp/artifact-static/bin/pip check
          /tmp/artifact-static/bin/python scripts/check_artifact_imports.py

      - name: Behavioural artifact gate (strict optional-ML boundary)
        run: |
          VERSION="$(python services/setup.py --version)"
          python scripts/artifact_runtime_gate.py \
            --find-links dist \
            --version "$VERSION" \
            --packages "services native" \
            --locked-dependency-requirements "$RUNNER_TEMP/linux-core-ci-wheelhouse/requirements.txt" \
            --locked-dependency-wheelhouse "$RUNNER_TEMP/linux-core-ci-wheelhouse" \
            --require-optional-boundary

      - name: Remove staged packaging wheelhouses
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/linux-core-ci-wheelhouse" "$RUNNER_TEMP/linux-ci-tools-wheelhouse"

      - name: Debian source-package dry run
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper dh-python pybuild-plugin-pyproject
          dpkg-buildpackage -S -us -uc -d

