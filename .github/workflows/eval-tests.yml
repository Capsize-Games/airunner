name: Hybrid Runtime CI

on:
  pull_request:
    branches: [master, llm-refactor, hybrid-runtime-foundation]
  push:
    branches: [master, llm-refactor, hybrid-runtime-foundation]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  # Services-only: the services package exposes the "development" extra
  # (issue #2054). The former root GUI package was removed.
  TEST_PROFILES: development

jobs:
  runtime-contract-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libglx-mesa0 \
            libegl1 \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # airunner-common moved to its own repository (issue #2197,
          # https://github.com/Capsize-Games/airunner-common) and is
          # resolved from PyPI now via services/setup.py's own declared
          # dependency, rather than installed from a local checkout.
          pip install -e "./services[$TEST_PROFILES]"

      # Required deterministic checks (C01: safety, auth, download,
      # data migration). This list is the PR-side half of the release
      # gate: linux-candidate in pypi-dispatch.yml runs the same
      # safety/auth/download/migration files before assembling the
      # bundle, and candidate-gate blocks promotion unless the full
      # required set reports success. No continue-on-error here.
      - name: Run runtime contract tests
        run: |
          pytest \
            services/tests/test_service_bootstrap.py \
            services/tests/test_legacy_api_surface.py \
            services/tests/test_loopback_auth.py \
            services/tests/test_secret_storage.py \
            services/tests/test_model_load_security.py \
            services/tests/test_tool_sandbox_security.py \
            services/tests/test_dependency_constraints.py \
            services/tests/test_native_package_isolation.py \
            services/tests/test_zimage_model_dir_config.py \
            services/tests/test_third_party_notices.py \
            services/tests/test_llm_request_for_action_parity.py \
            services/tests/test_content_safety_gate.py \
            services/tests/test_download_security.py \
            services/tests/test_release_b02.py \
            services/tests/test_import_boundaries.py \
            -v \
            --tb=short \
            --junitxml=runtime-contracts.xml
        env:
          AIRUNNER_HEADLESS: "1"
          AIRUNNER_HTTP_PORT: "8188"
          AIRUNNER_HTTP_HOST: "127.0.0.1"

      # Issue #2225 parity is covered by
      # services/tests/test_llm_request_for_action_parity.py in the
      # contract list above (the standalone compare script was removed
      # with the desktop client).

      - name: Upload runtime contract results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-contract-results
          path: runtime-contracts.xml

  runtime-smoke:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: llm
            smoke-flag: --llm-runtime-smoke
          - name: stt
            smoke-flag: --stt-runtime-smoke
          - name: art
            smoke-flag: --art-runtime-smoke
          - name: tts
            smoke-flag: --tts-runtime-smoke

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libglx-mesa0 \
            libegl1 \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e "./services[$TEST_PROFILES]"

      - name: Run ${{ matrix.name }} runtime smoke tests
        run: |
          python scripts/run_tests.py \
            ${{ matrix.smoke-flag }} \
            --verbose

  packaging-gates:
    # import-boundary + artifact gates on every PR, so
    # boundary/packaging regressions cannot merge green. The static
    # artifact gate (check_artifact_imports) and the behavioural
    # runtime gate run here against the freshly built wheels in clean
    # environments; the release workflow (pypi-dispatch.yml) re-runs
    # the behavioural gate before Publish. The runtime gate fails
    # closed when the candidate VERSION already exists on PyPI (it
    # cannot prove it installed the local artifact) -- bump the
    # version when that fires on a PR. No continue-on-error here.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Enforce import boundaries on the source tree
        run: |
          python scripts/check_import_boundaries.py
          pytest scripts/tests/test_import_boundary_rules.py -o addopts='' -q

      - name: Build candidate wheels
        run: |
          python -m pip install --upgrade pip build
          mkdir -p dist
          python -m build --outdir dist services
          python -m build --outdir dist native
          ls -1 dist/

      # The .deb ships native/ and airunner_common/ as loose files
      # with no dist-info (debian/airunner.install), so version drift
      # there is silent. Fail when the vendored pins disagree with
      # what the packages declare.
      - name: Debian vendored-version drift check
        run: |
          python - <<'EOF'
          import re
          import types
          from pathlib import Path


          def setup_version(path, call):
              src = Path(path).read_text(encoding="utf-8").replace(call, "")
              mod = types.ModuleType("probe")
              mod.__file__ = str(path)
              exec(compile(src, str(path), "exec"), mod.__dict__)
              return mod.VERSION


          native_version = setup_version(
              "native/setup.py",
              'setup(**build_native_setup_kwargs(package_source_dir="src"))',
          )
          vendor_readme = Path("debian/vendor/README.source").read_text()
          vendored = re.search(
              r"Distribution: airunner-common (\S+) \(PyPI\)", vendor_readme
          ).group(1)
          services_src = Path("services/setup.py").read_text()
          required = re.search(
              r'"airunner-common~=(.*?)"', services_src
          ).group(1)
          assert native_version, "native VERSION is empty"
          print(f"native={native_version} vendored-common={vendored} "
                f"services-requires~={required}")
          assert vendored == required, (
              f"vendored airunner-common {vendored} != services pin {required}"
          )
          EOF

      - name: Static artifact gate in a clean install
        run: |
          python -m venv /tmp/artifact-static
          /tmp/artifact-static/bin/pip install --upgrade pip
          VERSION="$(python services/setup.py --version)"
          /tmp/artifact-static/bin/pip install \
            --find-links dist \
            "airunner-services==$VERSION" "airunner-native==$VERSION"
          /tmp/artifact-static/bin/python scripts/check_artifact_imports.py

      - name: Behavioural artifact gate (strict optional-ML boundary)
        run: |
          VERSION="$(python services/setup.py --version)"
          python scripts/artifact_runtime_gate.py \
            --find-links dist \
            --version "$VERSION" \
            --packages "services native" \
            --require-optional-boundary

      - name: Debian source-package dry run
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper dh-python pybuild-plugin-pyproject
          dpkg-buildpackage -S -us -uc -d

