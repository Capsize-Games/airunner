[build-system]
# setuptools must stay <82: the pinned torch==2.13.0+cu129 wheel's runtime
# metadata requires setuptools<82 (issue #2057). Bumping past 82 breaks
# `pip check`; see services/tests/test_dependency_constraints.py.
requires = ["setuptools>=80.9.0,<82", "wheel"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# mypy configuration (issue #2052).
#
# Pragmatic, non-breaking baseline for the existing tree:
#   - third-party packages without stubs are ignored
#   - imported modules are checked in isolation (--follow-imports=skip style,
#     matching scripts/mypy_shortcut.py) to keep per-file runs fast
#   - warn_unused_ignores / check_untyped_defs keep new code honest without
#     requiring a full strict migration
# Target: graduate to stricter flags (disallow_untyped_defs, then strict) as
# the tree's annotation coverage improves.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
plugins = []
ignore_missing_imports = true
# Suppress "Library stubs not installed" for third-party libs without bundled
# types (e.g. PyYAML) - equivalent to the old --ignore-missing-imports
# behavior on untyped-but-installed libraries.
disable_error_code = ["import-untyped"]
follow_imports = "skip"
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true

# Generated code is excluded from the strictness baseline; keep per-module
# overrides here so the project config remains the single source.
[[tool.mypy.overrides]]
module = ["airunner.feather_rc"]
ignore_errors = true

[tool.black]
exclude = '.*_ui\.py$'
line-length = 79

[tool.pytest.ini_options]
markers = [
    "slow: tests that take a long time to run",
    "fast: tests that use mocked responses and run quickly",
    "asyncio: asynchronous test marker",
    "integration: integration test marker",
    "gpu: tests that require GPU hardware",
    "eval: evaluation tests for LLM/model quality testing",
    "streaming: tests for streaming response functionality",
    "llm_runtime_smoke: safe llama.cpp runtime smoke tests using doubles only",
    "stt_runtime_smoke: safe STT runtime smoke tests using doubles only",
    "art_runtime_smoke: safe art runtime smoke tests using doubles only",
    "art_service_runtime: direct art service runtime tests using real local models",
    "tts_runtime_smoke: safe TTS runtime smoke tests using doubles only",
    "llm_required: tests that require an LLM model to be loaded",
    "benchmark: tests using standard benchmark datasets (GSM8K, MATH, HumanEval)",
    "code: tests for code generation capabilities",
]
# Services-only suite (services/tests) is collected by a plain
# `pytest` run. The former desktop GUI suite (src/) was removed; this
# repo ships the headless daemon + FastAPI consumed by airunnerweb.
testpaths = ["services/tests"]
# Disable parallel execution to prevent worker cleanup issues
# Use serial execution for now until worker cleanup is fixed
# -s disables output capturing for real-time feedback
# -v shows verbose test names
addopts = "--maxfail=100 --timeout=30 -s -v"