# Linux v1 services directory-bundle specification (release P05).
#
# Extends the P04 recipe (release-planning/linux-v1/packaging-decision.md:
# directory-mode PyInstaller) to the complete application bundle. Read by
# scripts/assemble_linux_bundle.py (build) and
# scripts/inspect_linux_bundle.py (verify); enforced by
# services/tests/test_release_p05.py.
#
# SERVICES-ONLY SCOPE: the shipped Linux v1 artifact is the services
# bundle (airunner-services daemon, Qt-free). There is deliberately no
# Qt/PySide6 payload, no Qt plugin set, and no WebEngine helper here;
# the [qt] section records that as a checked decision, not an omission.
# GUI-only R01 features map to "gui" in [r01_coverage]: they are served
# by the desktop bundle, explicitly out of this artifact's scope.
#
# Models are never bundled: weight files (*.gguf, *.safetensors, ...)
# are [exclusions], and model downloads remain explicit post-install
# steps (R01 DL-01/DL-02, D01/D02).
#
# Production policy data is never required from a public checkout: the
# content-safety signature entry below is required=false because signed
# policy provisioning happens in trusted release CI (S06). Tests use a
# synthetic policy fixture, never production policy bytes.

[bundle]
# Frozen executable name inside the bundle root. Matches
# LinuxBundleLayout.daemon_executable(): <bin_dir>/airunner-daemon.
name = "airunner-services"
executable = "airunner-daemon"
tool = "pyinstaller==6.12.0"
mode = "onedir"
entry_module = "airunner_services.daemon"
entry_function = "main"
# Manifest identity of the entry point ("module:function").
entry = "airunner_services.daemon:main"
# P02 lock consumed by the isolated build environment.
constraints = "package/constraints-linux-nvidia-cu129.txt"

[profile]
# The services-side Linux v1 NVIDIA release profile (P02): the
# "desktop" aggregate of services/setup.py. The aggregates list must
# union to exactly that aggregate's requirement list, in order.
services_extra = "desktop"
aggregates = [
    "llm-native",
    "stt-native",
    "art-python",
    "tts-python",
    "llm_weather",
    "search",
    "computer_use",
    "nvidia",
    "linux",
]

[qt]
# No Qt in the services bundle (see header). The inspector fails the
# bundle if any qt_marker path segment appears (case-insensitive).
required = false
reason = "services-only release scope: the daemon has no Qt frontend"
qt_markers = ["PySide6", "shiboken6", "libqxcb", "Qt6"]

# Console-script surface the bundle must preserve. Must match
# SERVICE_CONSOLE_SCRIPTS in services/setup.py exactly; the inspector
# checks every module is present in the frozen PYZ table of contents.
[[console_script]]
name = "airunner-daemon"
module = "airunner_services.daemon"
function = "main"
primary = true

[[console_script]]
name = "airunner-headless"
module = "airunner_services.bin.airunner_headless"
function = "main"
primary = false

[[console_script]]
name = "airunner-service"
module = "airunner_services.bin.airunner_service"
function = "main"
primary = false

[[console_script]]
name = "airunner-generate-migration"
module = "airunner_services.bin.generate_migration"
function = "main"
primary = false

[[console_script]]
name = "airunner-hf-download"
module = "airunner_services.bin.airunner_hf_download"
function = "main"
primary = false

[[console_script]]
name = "airunner-civitai-download"
module = "airunner_services.bin.airunner_civitai_download"
function = "main"
primary = false

# Runtime-string imports PyInstaller's static analysis cannot see (the
# P04 probe_data finding). Each entry cites the loader; the regression
# test re-derives the literal module names from those loaders by AST.
[code]
# --hidden-import: exact modules loaded by runtime string, plus every
# non-entry console-script module (entry points are never imported by
# the daemon, so the modulegraph drops them and the frozen CLI loses
# subcommands -- issue #2244).
hidden_imports = [
    # tool_registry.py:270 ensure-import of the tools package.
    "airunner_services.llm.tools",
    # model_registry.py:64 provider-config lookup.
    "airunner_services.llm.provider_config",
    # message_envelopes.py:13 IPC message lookup.
    "airunner_services.ipc.messages",
    # [[console_script]] airunner-headless (explicit, not accidental).
    "airunner_services.bin.airunner_headless",
    # [[console_script]] airunner-service.
    "airunner_services.bin.airunner_service",
    # [[console_script]] airunner-generate-migration.
    "airunner_services.bin.generate_migration",
    # [[console_script]] airunner-hf-download.
    "airunner_services.bin.airunner_hf_download",
    # [[console_script]] airunner-civitai-download.
    "airunner_services.bin.airunner_civitai_download",
]
# --exclude-module: subtrees the services daemon never executes.
# Guard-verified in the worktree (issue #2244), not assumed: the
# airunner desktop package is imported only from
# airunner_native/launcher.py function scope (desktop/test flows;
# the module top level is Qt/GUI-free) and from GUI-internal
# modules; PySide6/shiboken6 are imported function-level there and
# in crash_handler.py (try/except), services get_qsettings.py
# (every caller guards ImportError), and ipykernel.eventloops (a
# Qt-probe function). A regression test asserts no module-scope
# import of these tops in services/ or native/, and the
# toc-exclusion gate fails the build if one is frozen anyway.
exclude_modules = [
    "airunner",
    "PySide6",
    "shiboken6",
]
# --hidden-import for native extensions whose submodules analysis
# cannot see. libzim's reader/search entry points are injected by
# its extension .so at import time, so the modulegraph records
# them missing and never collects the .so itself (build #1: the
# frozen bundle lacked libzim while dev imports it fine). Dotted
# names name a submodule .so (scipy._cyutility is cimported by
# scipy._lib._ccallback_c at init, invisible to the modulegraph and
# absent from the warn file; #2245). Presence is verified on the
# bundle tree (_internal/<dotted/path>*.so), never the PYZ table
# of contents.
extension_modules = [
    "libzim",
    "scipy._cyutility",
]
# --collect-submodules: every module under each parent ships, which
# covers the 17 literal tool modules in tool_registry.py's
# modules_to_reload list (llm.tools x15, tools.web_tools,
# llm.agents.workflow_tools) plus the lazy _EXPORTS table in
# runtimes/__init__.py. Third-party parents cover dynamic imports
# static analysis cannot see: the vendored array_api_compat
# numpy/__init__ files import .fft/.linalg via computed
# __import__(__package__ + ...), invisible to the modulegraph and
# absent from the warn file (scipy linalg/fft crash the frozen
# daemon at transformers import; #2245).
collect_submodules = [
    "airunner_services.llm.tools",
    "airunner_services.llm.agents",
    "airunner_services.tools",
    "airunner_services.runtimes",
    "scipy._external.array_api_compat.numpy",
    "sklearn.externals.array_api_compat.numpy",
]
# --collect-data: package data discovered by static import analysis.
collect_data = ["airunner_services"]
# --copy-metadata: importlib.metadata lookups at runtime
# (utils/application/get_version.py PACKAGE_NAMES). The "airunner" GUI
# distribution is intentionally absent: get_version() falls through to
# the next installed distribution, so the services bundle only carries
# the metadata of distributions it actually ships.
copy_metadata = [
    "airunner-services",
    "airunner-native",
    "airunner-common",
]
# --collect-binaries: native .so payloads loaded by filesystem path
# at runtime (torch.ops.load_library, ctypes), invisible to the
# modulegraph. Presence is verified on the bundle tree
# (_internal/<package>/**/*.so), never the PYZ table of contents.
collect_binaries = [
    # mslk/__init__.py _load_library: torch.ops.load_library on the
    # sibling mslk.so (boot dies in `import mslk` without it; #2245).
    # The default lib*.so pattern misses the bare name, so
    # hook-mslk.py collects it explicitly; the flag is a harmless
    # no-op and the gate verifies the file landed.
    "mslk",
    # llama_cpp/llama_cpp.py: ctypes libllama.so from llama_cpp/lib/
    # (plus versioned SONAME deps via hook-llama_cpp.py).
    "llama_cpp",
    # torchcodec file-finder: libtorchcodec_{core,custom_ops,
    # pybind_ops}{4..8}.so by path (FFmpeg-versioned set).
    "torchcodec",
]
# --runtime-hook: frozen-only import patches, repo-relative paths.
# Missing files fail the build (recipe bug, like an empty data glob).
runtime_hooks = [
    # Repairs transformers' lazy import-structure scan for the frozen
    # layout (__init__.pyc has no on-disk file to isfile(); #2245).
    "packaging/linux/pyi-rthooks/pyi_rth_transformers_frozen.py",
]
# --additional-hooks-dir: repo-relative dirs holding hook-*.py files
# for packages PyInstaller's bundled hooks don't cover. Missing
# dirs fail the build (recipe bug, like an empty data glob).
additional_hooks_dirs = [
    # hook-mslk.py (mslk.so + triton-jit py-mode) and
    # hook-llama_cpp.py (versioned SONAME libs); #2245.
    "packaging/linux/pyi-hooks",
]
# Frozen-import preconditions: bundle-relative source files the
# runtime hooks scan at import time. transformers' lazy structure
# reads .py sources collected by hooks-contrib's pyz+py mode; if
# that collection ever stops, the build must fail here instead of
# shipping a daemon that dies at boot (issue #2245).
frozen_source_markers = [
    "_internal/transformers/models/__init__.py",
    "_internal/transformers/models/auto/__init__.py",
    # triton-jit py-mode source: @triton.jit decoration reads this
    # file at import time (hook-mslk.py; #2245).
    "_internal/mslk/quantize/triton/fp8_quantize.py",
]

# Data payloads. source is a repo-relative glob; dest is the
# bundle-relative directory each matched file lands in (basename
# preserved). stage "collect" becomes a PyInstaller --add-data entry;
# stage "root" is copied beside the executable after the freeze (legal
# notices must be visible at the bundle top level, not inside the
# collected tree). required=false entries may match nothing: they are
# release-CI-provisioned artifacts, never demanded from a checkout.
[[data]]
source = "services/src/airunner_services/database/alembic.ini"
dest = "airunner_services/database"
stage = "collect"
required = true
comment = "additive idempotent migrations (spec item 5)"

[[data]]
source = "services/src/airunner_services/database/alembic/*.py"
dest = "airunner_services/database/alembic"
stage = "collect"
required = true

[[data]]
source = "services/src/airunner_services/database/alembic/*.mako"
dest = "airunner_services/database/alembic"
stage = "collect"
required = true

[[data]]
source = "services/src/airunner_services/database/alembic/versions/*.py"
dest = "airunner_services/database/alembic/versions"
stage = "collect"
required = true

[[data]]
source = "services/src/airunner_services/content_safety/data/*.dat"
dest = "airunner_services/content_safety/data"
stage = "collect"
required = true
comment = "policy data file; tests substitute a synthetic fixture"

[[data]]
source = "services/src/airunner_services/content_safety/data/*.dat.sig"
dest = "airunner_services/content_safety/data"
stage = "collect"
required = false
comment = "signed policy signature, provisioned in trusted CI (S06)"

[[data]]
source = "services/src/airunner_services/assets/reference_speakers/*.wav"
dest = "airunner_services/assets/reference_speakers"
stage = "collect"
required = true

[[data]]
source = "services/src/airunner_services/bin/*.sh"
dest = "airunner_services/bin"
stage = "collect"
required = true

[[data]]
source = "LICENSE"
dest = "legal"
stage = "root"
required = true

[[data]]
source = "NOTICE"
dest = "legal"
stage = "root"
required = true

[[data]]
source = "THIRD_PARTY_NOTICES.md"
dest = "legal"
stage = "root"
required = true

[runtimes]
# Native sidecar executables resolve per
# runtimes/bundled_runtime_paths.py: $AIRUNNER_BUNDLE_ROOT/bin/<name>,
# overridable per-binary via the env column. Binaries are
# release-provided (pinned airunner-native bundle); the assembler only
# guarantees bin/ exists, and the inspector warns (not fails) when a
# sidecar is absent unless --require-sidecars is given.
bin_dir = "bin"
root_env = "AIRUNNER_BUNDLE_ROOT"

[[runtime]]
name = "llama-server"
env = "AIRUNNER_LLAMA_SERVER_BIN"
feature = "CHAT-03"

[[runtime]]
name = "whisper-server"
env = "AIRUNNER_WHISPER_SERVER_BIN"
feature = "VOICE-02"

[exclusions]
# Filename gate: any bundle file matching one pattern fails
# inspection. Matched against both the bundle-relative path and the
# bare filename, so "*.gguf" catches weights at any depth.
patterns = [
    # Models stay outside the application (Outcome).
    "*.gguf",
    "*.safetensors",
    "*.pt",
    "*.pth",
    "*.ckpt",
    "*.onnx",
    # Secrets and credentials.
    ".env",
    "*.pem",
    "*.key",
    "*credentials*",
    "*secret*",
    # Developer tooling and test harness.
    "conftest.py",
    "test_*",
    "*_test.py",
    "pytest*",
    "*.egg-info",
    # Caches.
    "__pycache__",
    "*.pyc",
    "*.pyo",
    ".pytest_cache",
    # Customer/user data must never be packaged.
    "*.sqlite3",
    "*.sqlite",
    "*.db",
    "user-data",
]

# Post-freeze prune: bundle-relative globs the assembler deletes
# after the freeze and before the manifest is written. These are
# hook-collected test/support data the daemon never reads (never
# code the daemon imports). Each entry carries its review reason;
# globs must stay under _internal/. Prune misses fail safe: the
# exclusion scan still gates whatever remains.
[[prune]]
glob = "_internal/jedi/**"
reason = "hook-jedi typeshed/django-stub data (.pyi, never imported); the 34 secret/credential plus test/pytest pattern matches were individually content-reviewed (type declarations only, zero secret bytes, build #1); no services/native/common module imports jedi"

[[prune]]
glob = "_internal/IPython/testing/**"
reason = "hook-IPython collects IPython's own test fixtures (.txt test_*); data files, never imported"

[[prune]]
glob = "_internal/torch/**/test_*.py"
reason = "hook-torch collects test-support sources as data; every match is also resident in the PYZ (build #1 toc), so runtime imports are unaffected"

[[prune]]
glob = "_internal/torch/**/*_test.py"
reason = "hook-torch collects test-support sources as data; every match is also resident in the PYZ (build #1 toc), so runtime imports are unaffected"

[[prune]]
glob = "_internal/timm/**/test_*.py"
reason = "hook-collected test-support source, also resident in the PYZ (build #1 toc)"

[[prune]]
glob = "_internal/pyarrow/include/**"
reason = "hook-pyarrow collects C++ headers (.h/.hpp, compile-time only, never imported)"

[exclusion_allowlist]
# Exact bundle-relative paths that match [exclusions] patterns but
# are reviewed benign. The inspector tolerates exactly these paths,
# nothing else: a new secret/credential/test payload still fails.
paths = [
    # Mozilla CA bundle collected by hook-certifi: 121 CERTIFICATE
    # blocks, 0 private-key blocks (build #1 evidence); required
    # for daemon TLS (requests/urllib3/huggingface_hub).
    "_internal/certifi/cacert.pem",
]

[warn_allowlist]
# Reviewed missing-module set (issue #2244, build #1 evidence).
# Compared by top-level name. Review method: every module under
# these tops was probed against the build venv with importlib
# (1,214 unresolvable + 335 parent-absent + 22 native-attribute
# probes, all behaving identically frozen); the only resolvable-
# but-missing case found, libzim's .so-injected submodules, is
# PROVIDED via [code] extension_modules instead of merely
# allowlisted. First-party tops were additionally code-read (see
# below). Excluded tops (airunner, PySide6, shiboken6) are
