<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UwUChat prototype surface</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif;
         background: #14141c; color: #e8e8f0; }
  #banner { background: #5a3a00; color: #ffd479; padding: 6px 12px;
            font-size: 12px; }
  #log { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .row { max-width: 80%; padding: 8px 12px; border-radius: 12px;
         white-space: pre-wrap; }
  .you { align-self: flex-end; background: #24405e; }
  .uwu { align-self: flex-start; background: #2a2a38; }
  .sys { align-self: center; color: #8a8aa0; font-size: 12px; }
  #composer { position: fixed; bottom: 0; left: 0; right: 0; display: flex;
              gap: 8px; padding: 10px; background: #1c1c26; }
  #msg { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid #333;
         background: #101018; color: inherit; }
  button { padding: 8px 16px; border-radius: 8px; border: 0;
           background: #0a84b9; color: #fff; }
</style>
</head>
<body>
<div id="banner">PROTOTYPE ONLY &mdash; minimal surface, stubbed LLM,
loopback-only. Not the final UwUChat UI.</div>
<div id="log"></div>
<div id="composer">
  <input id="msg" value="Hello from the Qt window">
  <button id="send">Send</button>
</div>
<script>
const log = document.getElementById("log");
let replyEl = null;

function append(kind, text) {
  const row = document.createElement("div");
  row.className = "row " + kind;
  row.textContent = text;
  log.appendChild(row);
  return row;
}

function beginReply() {
  replyEl = append("uwu", "");
}

function handleMessage(raw) {
  let m;
  try { m = JSON.parse(raw); } catch { return; }
  if (m.type === "bootstrap") {
    const names = (m.body.chatbots || []).map((c) => c.botname || c.name);
    append("sys", "bootstrap: " + names.join(", "));
    sendRpc("GET", "/api/v1/llm/thread");
    return;
  }
  if (m.type === "rpc_response") {
    append("sys", "rpc " + m.status + " " + JSON.stringify(m.body));
    return;
  }
  if (m.type === "thinking") {
    if (m.status === "started" && !replyEl) beginReply();
    return;
  }
  if (m.type === "mood") {
    append("sys", "mood: " + m.mood + " " + m.emoji);
    return;
  }
  if (m.type === "error") {
    append("sys", "error: " + (m.error || m.content || "unknown"));
    return;
  }
  if (m.type === "chunk") {
    if (!replyEl) beginReply();
    replyEl.textContent += m.content || "";
    if (m.done) { append("sys", "done (" + (m.call_chain_id || "-") + ")"); replyEl = null; }
  }
}

let eventsWs = null;
let streamWs = null;

function sendRpc(method, path) {
  eventsWs.send(JSON.stringify({
    type: "rpc", id: "rpc-" + Date.now() + "-" + Math.random(),
    method, path, body: {},
  }));
}

function send() {
  const box = document.getElementById("msg");
  const text = box.value.trim();
  if (!text || !streamWs || streamWs.readyState !== WebSocket.OPEN) return;
  append("you", text);
  box.value = "";
  streamWs.send(JSON.stringify({
    type: "chat", messages: [{ role: "user", content: text }], chatbot_id: 1,
  }));
}

function connect() {
  eventsWs = new WebSocket("ws://" + location.host + "/api/v1/events");
  eventsWs.onmessage = (e) => handleMessage(e.data);
  streamWs = new WebSocket("ws://" + location.host + "/api/v1/llm/stream");
  streamWs.onmessage = (e) => handleMessage(e.data);
  document.getElementById("send").onclick = send;
  document.getElementById("msg").addEventListener("keydown", (e) => {
    if (e.key === "Enter") send();
  });
}

window.addEventListener("load", connect);
window.__prototypeSend = () => send();
</script>
</body>
</html>
